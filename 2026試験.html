}
function setAnswer(n) {
  const q = E.qs[E.idx];
  if (n == null) delete E.answers[q.id]; else E.answers[q.id] = n;
  saveSession();
  renderExam(true);
}
function goQ(i) {
  E.idx = Math.min(Math.max(0, i), E.qs.length - 1);
  saveSession();
  renderExam(false);
}
function openGrid() {
  const prev = document.activeElement;
  const n = E.qs.length;
  const answered = Object.keys(E.answers).length;
  const flaggedN = E.qs.filter(q => E.flags[q.id]).length;
  const close = () => { document.removeEventListener('keydown', onKey, true); back.remove(); modalOpen--; if (prev && prev.focus) { try { prev.focus(); } catch (e) { /* ignore */ } } };
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  const cells = E.qs.map((q, i) => {
    const done = E.answers[q.id] != null, fl = !!E.flags[q.id];
    const state = fl ? (done ? '見直し（解答済み）' : '見直し（未解答）') : done ? '解答済み' : '未解答';
    return h('button', { class: 'gn' + (fl ? ' flag' : done ? ' done' : '') + (i === E.idx ? ' cur' : ''),
      'aria-label': '問' + q.no + '：' + state + (i === E.idx ? '（表示中）' : ''),
      onclick: () => { close(); goQ(i); } },
      String(q.no), h('small', null, fl ? '⚑見直し' + (done ? '✓' : '') : done ? '✓' : '—'));
  });
  const back = h('div', { class: 'back sheet-mode', onclick: ev => { if (ev.target === back) close(); } },
    h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'grid-t' },
      h('div', { class: 'sheet-hd' }, h('h3', { id: 'grid-t' }, '問題一覧'), h('button', { class: 'icon-btn txt', onclick: close }, '閉じる')),
      h('p', { class: 'small', style: 'margin:0' }, '解答 ' + answered + '/' + n + '問・未解答 ' + (n - answered) + '問・見直し ' + flaggedN + '問'),
      h('div', { class: 'legend' },
        h('span', null, h('i', { class: 'done' }), '✓ 解答済み'),
        h('span', null, h('i'), '— 未解答'),
        h('span', null, h('i', { class: 'flag' }), '⚑ 見直し')),
      h('div', { class: 'grid' }, cells),
      h('button', { class: 'btn primary', onclick: () => { close(); submitExam(); } }, '採点する')));
  document.body.append(back); modalOpen++;
  document.addEventListener('keydown', onKey, true);
  const cur = back.querySelector('.gn.cur'); if (cur) cur.focus();
}
async function submitExam() {
  const un = E.qs.length - Object.keys(E.answers).length;
  const body = un > 0 ? '未解答が' + un + '問あります。このまま採点しますか？（未解答は0点です）' : '採点すると解答は変更できません。';
  if (await confirmBox('採点しますか？', body, '採点する', 'primary', '試験に戻る')) finishExam(false);
}
async function interruptExam(fromPop) {
  if (!E || !E.active) return;
  const ok = await confirmBox('試験を中断しますか？', '途中経過は保存され、ホームの「続きから再開」から再開できます。中断中は時間が止まります。', '中断してホームへ', 'primary', '試験を続ける');
  if (ok) {
    saveSession();
    stopTimer();
    E.active = false;
    if (fromPop) { navView = 'home'; viewHome(); } else { viewBack(); }
  } else if (fromPop) {
    try { history.pushState({ eisei: 1 }, ''); navPushed = true; } catch (e) { /* ignore */ }
  }
}
function finishExam(timeUp) {
  if (!E || !E.active || E.finishing) return;
  E.finishing = true;
  stopTimer();
  E.active = false;
  const usedSec = Math.round((E.limitMs - Math.max(0, E.deadline - Date.now())) / 1000);
  const R = { kind: 'exam', mode: 'exam', label: SETS[E.set] + '／' + E.variant.name, set: E.set, variant: E.variant,
    qs: E.qs, answers: Object.assign({}, E.answers), timeUp: !!timeUp, at: Date.now(), usedSec: Math.min(usedSec, E.variant.minutes * 60) };
  // 学習記録: 全問を記録（未解答は不正解扱い）
  const stats = loadStats();
  R.qs.forEach(q => recordAnswer(stats, q.id, R.answers[q.id] === q.answer));
  saveStats(stats);
  const g = gradeExam(R.qs, R.answers, R.variant);
  pushHistory({ t: R.at, kind: 'exam', mode: 'exam', label: R.label, set: R.set, variant: R.variant.idx, score: g.total, max: g.max,
    passed: g.passed, correct: g.cats.reduce((s, c) => s + c.correct, 0), total: R.qs.length, timeUp: !!timeUp, usedSec: R.usedSec,
    qids: R.qs.map(q => q.id), ans: R.answers });
  Store.remove('session');
  viewResult(R);
}

/* ==========================================================================
   7. 練習モード
   ========================================================================== */
let P = null;
let catOrder = 'random';

function viewCats() {
  enterSub();
  const st = loadStats();
  const draw = () => {
    const items = CAT_KEYS.map(k => {
      const c = CATS[k];
      const qs = QS.filter(q => q.cat === k);
      const done = qs.filter(q => st[q.id] && st[q.id].n > 0);
      const right = done.filter(q => st[q.id].last === true).length;
      return h('button', { class: 'opt', onclick: () => {
        const list = catOrder === 'random' ? shuffle(qs) : qs.slice().sort((a, b) => a.set.localeCompare(b.set) || a.no - b.no);
        startPractice('cat', '分野別：' + c.short, list);
      } },
        h('b', null, c.name),
        h('span', null, qs.length + '問（' + SET_KEYS.map(s => SETS[s].replace('予想', '') + qs.filter(q => q.set === s).length).join('＋') + '）・' + c.points + '点/問'),
        h('span', null, done.length ? '解答済み ' + done.length + '問・直近正解 ' + right + '問（' + pct(right, done.length) + '%）' : 'まだ解いていません'));
    });
    screen({
      header: subHeader('分野別練習', viewBack),
      body: [
        h('p', { class: 'small muted', style: 'margin:0 0 8px' }, '模試A・Bの該当問題をまとめて出題します。'),
        h('div', { class: 'seg', role: 'group', 'aria-label': '出題順' },
          h('button', { 'aria-pressed': String(catOrder === 'random'), onclick: () => { catOrder = 'random'; draw(); } }, 'ランダム順'),
          h('button', { 'aria-pressed': String(catOrder === 'seq'), onclick: () => { catOrder = 'seq'; draw(); } }, '問題番号順')),
        items
      ]
    });
  };
  draw();
}

function startPractice(mode, label, qs) {
  if (!qs || !qs.length) { toast('出題できる問題がありません'); return; }
  stopTimer();
  enterSub();
  P = { active: true, finished: false, mode, label, qs, idx: 0, answers: {} };
  renderPractice();
}
function renderPractice(keepScroll) {
  const q = P.qs[P.idx], n = P.qs.length;
  const chosen = P.answers[q.id];
  const revealed = chosen != null;
  const c = CATS[q.cat];
  const body = [
    h('div', { class: 'q-head' },
      h('span', { class: 'q-no' }, (P.idx + 1) + '問目'),
      h('span', { class: 'chip cat' }, c.short),
      revealed ? h('span', { class: 'chip stars', 'aria-label': '頻出度 ' + q.freq + '（3段階）' }, '頻出度 ' + stars(q.freq)) : null),
    h('div', { class: 'q-text' }, q.q),
    h('div', { class: 'choices', role: 'group', 'aria-label': '選択肢' }, q.choices.map((t, i) => choiceNode(q, i + 1, t, chosen, !revealed ? () => answerPractice(i + 1) : null)))
  ];
  if (revealed) body.push(verdictNode(q, chosen), explainNode(q));
  const last = P.idx === n - 1;
  screen({
    header: h('header', { class: 'topbar' }, h('div', { class: 'wrap topbar-in' },
      h('button', { class: 'icon-btn', 'aria-label': '練習をやめる', onclick: () => quitPractice(false) }, '✕'),
      h('div', { class: 'tb-mid' }, (P.idx + 1) + ' / ' + n + '問', h('span', { class: 'tb-sub' }, '　' + P.label)))),
    progress: Math.round((P.idx + (revealed ? 1 : 0)) * 100 / n),
    body,
    bar: h('button', { class: 'btn primary', disabled: !revealed, onclick: nextPractice }, !revealed ? '選択肢をタップして解答' : last ? '結果を見る' : '次の問題へ →'),
    keepScroll
  });
}
const choiceKids = (no, text, badge) => [h('span', { class: 'c-no' }, noLabel(no)),
  h('span', { class: 'c-body' }, h('span', { class: 'c-tx' }, text), badge ? h('span', { class: 'c-badge' }, badge) : null)];
/* 選択肢1つ分。chosen が未定義なら出題中、定義済みなら正誤表示 */
function choiceNode(q, no, text, chosen, onTap) {
  const revealed = chosen != null;
  const isAns = no === q.answer, isMine = no === chosen;
  let cls = 'choice', badge = null;
  if (revealed) {
    if (isAns) { cls += ' is-correct'; badge = isMine ? '○ 正答・あなたの解答' : '○ 正答'; }
    else if (isMine) { cls += ' is-wrong'; badge = '× あなたの解答'; }
  }
  const kids = choiceKids(no, text, badge);
  if (onTap) return h('button', { class: cls, onclick: onTap }, kids);
  return h('button', { class: cls, disabled: true, 'aria-label': noLabel(no) + text + (badge ? '（' + badge + '）' : '') }, kids);
}
function verdictNode(q, chosen) {
  const ok = chosen === q.answer;
  return h('div', { class: 'verdict ' + (ok ? 'ok' : 'ng'), role: 'status', id: 'verdict' },
    h('span', null, ok ? '○ 正解' : '× 不正解'),
    h('small', null, ok ? '正答は ' + noLabel(q.answer) : '正答は ' + noLabel(q.answer) + '（あなた：' + noLabel(chosen) + '）'));
}
function explainNode(q) {
  return h('section', { class: 'card explain' },
    h('h3', null, '解説'),
    h('p', { class: 'exp' }, q.exp),
    h('h3', null, '選択肢ごとの解説'),
    h('ul', { class: 'notes' }, q.notes.map((t, i) =>
      h('li', { class: i + 1 === q.answer ? 'ans' : '' }, h('span', { class: 'n-no' }, noLabel(i + 1)), h('span', { class: 'n-tx' }, t)))),
    h('p', { class: 'ref' }, '根拠：' + q.ref),
    h('p', { class: 'ref' }, h('span', { class: 'nowrap' }, '分類：' + q.topic), '　', h('span', { class: 'nowrap' }, '頻出度 ' + stars(q.freq))));
}
function answerPractice(no) {
  const q = P.qs[P.idx];
  if (P.answers[q.id] != null) return;
  P.answers[q.id] = no;
  const stats = loadStats();
  recordAnswer(stats, q.id, no === q.answer);
  saveStats(stats);
  renderPractice(true);
  const v = document.getElementById('verdict');
  if (v) v.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function nextPractice() {
  if (P.idx < P.qs.length - 1) { P.idx++; renderPractice(false); return; }
  P.finished = true; P.active = false;
  const R = { kind: 'practice', mode: P.mode, label: P.label, qs: P.qs, answers: P.answers, at: Date.now() };
  const g = gradePractice(R.qs, R.answers);
  pushHistory({ t: R.at, kind: 'practice', mode: P.mode, label: P.label, correct: g.correct, total: g.total, qids: R.qs.map(q => q.id), ans: R.answers });
  viewResult(R);
}
async function quitPractice(fromPop) {
  const done = Object.keys(P.answers).length;
  const ok = await confirmBox('練習をやめますか？', done ? 'ここまでの解答（' + done + '問）は学習記録に残ります。' : null, 'やめてホームへ', 'primary', '続ける');
  if (ok) { P.active = false; if (fromPop) { navView = 'home'; viewHome(); } else viewBack(); }
  else if (fromPop) { try { history.pushState({ eisei: 1 }, ''); navPushed = true; } catch (e) { /* ignore */ } }
}

function viewResult(R) {
  enterSub();
  stopTimer();
  const isExam = R.kind === 'exam';
  const wrongQs = R.qs.filter(q => R.answers[q.id] !== q.answer);
  const body = [];
  let g, pg;
  if (isExam) {
    g = gradeExam(R.qs, R.answers, R.variant);
    body.push(h('p', { class: 'small muted', style: 'margin:0 0 8px' },
      R.label + '・' + fmtDate(R.at) + (R.usedSec != null ? '・所要 ' + fmtClock(R.usedSec * 1000) + ' / ' + R.variant.minutes + '分' : '')));
    if (R.timeUp) body.push(h('div', { class: 'notice', role: 'status' }, '制限時間に達したため、自動で採点しました。'));
    body.push(h('section', { class: 'score-card ' + (g.passed ? 'pass' : 'fail'), role: 'status' },
      h('div', { class: 'sc-verdict' }, g.passed ? '○ 合格' : '× 不合格'),
      h('div', { class: 'sc-score' }, String(g.total), h('small', null, ' / ' + g.max + '点')),
      h('div', { class: 'sc-sub' }, '合格点 ' + g.passTotal + '点（' + pct(g.passTotal, g.max) + '%）・正答 ' + g.cats.reduce((s, c) => s + c.correct, 0) + '/' + R.qs.length + '問')));
    // 範囲別
    const rows = g.cats.map(c => h('tr', { class: c.ok ? '' : 'bad' },
      h('td', null, CATS[c.cat].short), h('td', null, String(c.got)), h('td', null, String(c.max)), h('td', null, String(c.line)),
      h('td', null, c.ok ? '○ 通過' : '× 足切り')));
    rows.push(h('tr', { class: 'tot' + (g.totalOk ? '' : ' bad') },
      h('td', null, '合計'), h('td', null, String(g.total)), h('td', null, String(g.max)), h('td', null, String(g.passTotal)),
      h('td', null, g.totalOk ? '○ 達成' : '× 不足')));
    body.push(h('h2', { style: 'margin-top:6px' }, '範囲ごとの得点'));
    body.push(h('table', { class: 'tbl' },
      h('thead', null, h('tr', null, h('th', null, '範囲'), h('th', null, '得点'), h('th', null, '満点'), h('th', null, '基準点'), h('th', null, '判定'))),
      h('tbody', null, rows)));
    body.push(h('p', { class: 'small muted', style: 'margin:6px 0 0' }, '基準点：各範囲は満点の40%（足切り）、合計は満点の60%（合格点）。'));
    const reasons = [];
    g.failedCats.forEach(c => reasons.push(h('li', { class: 'ng' }, '× 足切り：「' + CATS[c.cat].name + '」が40%未満です（' + c.got + '/' + c.max + '点、足切りライン ' + c.line + '点）。')));
    if (!g.totalOk) reasons.push(h('li', { class: 'ng' }, '× 合計が合格点に届いていません（' + g.total + '点、合格点 ' + g.passTotal + '点。あと ' + (g.passTotal - g.total) + '点）。'));
    if (g.passed) reasons.push(h('li', { class: 'ok' }, '○ 全範囲が40%以上、かつ合計が60%以上です。'));
    body.push(h('ul', { class: 'reasons' }, reasons));
  } else {
    pg = gradePractice(R.qs, R.answers);
    body.push(h('p', { class: 'small muted', style: 'margin:0 0 8px' }, R.label + (R.replay ? '・' + fmtDate(R.at) : '')));
    body.push(h('section', { class: 'score-card neutral', role: 'status' },
      h('div', { class: 'sc-score' }, String(pg.correct), h('small', null, ' / ' + pg.total + '問 正解')),
      h('div', { class: 'sc-sub' }, '正答率 ' + pct(pg.correct, pg.total) + '%')));
    body.push(h('h2', { style: 'margin-top:6px' }, '範囲別の結果'));
    body.push(h('table', { class: 'tbl' },
      h('thead', null, h('tr', null, h('th', null, '範囲'), h('th', null, '正解'), h('th', null, '問数'), h('th', null, '正答率'))),
      h('tbody', null, pg.cats.map(c => h('tr', null,
        h('td', null, CATS[c.cat].short), h('td', null, String(c.correct)), h('td', null, String(c.count)), h('td', null, pct(c.correct, c.count) + '%'))))));
  }

  // 全問一覧
  let onlyWrong = false;
  const listHost = h('div');
  const drawList = () => {
    const items = [];
    R.qs.forEach((q, i) => {
      const a = R.answers[q.id];
      const ok = a === q.answer;
      if (onlyWrong && ok) return;
      const label = isExam ? '問' + q.no : (i + 1) + '問目';
      items.push(h('details', { class: 'item' + (ok ? '' : ' is-ng') },
        h('summary', null,
          h('span', { class: 'it-no' }, label),
          h('span', { class: 'it-mark ' + (ok ? 'ok' : 'ng') }, ok ? '○ 正解' : (a == null ? '× 未解答' : '× 不正解')),
          h('span', { class: 'it-ans' }, 'あなた：' + (a == null ? '—' : noLabel(a)) + '　正答：' + noLabel(q.answer))),
        h('div', { class: 'it-body' },
          h('div', { class: 'q-head', style: 'margin-top:10px' },
            h('span', { class: 'chip cat' }, CATS[q.cat].short), h('span', { class: 'chip' }, q.topic)),
          h('div', { class: 'q-text' }, q.q),
          h('div', { class: 'choices' }, q.choices.map((t, k) => {
            const no = k + 1, isAns = no === q.answer, isMine = no === a;
            let cls = 'choice', badge = null;
            if (isAns) { cls += ' is-correct'; badge = isMine ? '○ 正答・あなたの解答' : '○ 正答'; }
            else if (isMine) { cls += ' is-wrong'; badge = '× あなたの解答'; }
            return h('div', { class: cls }, choiceKids(no, t, badge));
          })),
          h('div', { style: 'height:12px' }),
          explainNode(q))));
    });
    listHost.replaceChildren(...(items.length ? items : [h('div', { class: 'empty' }, '間違えた問題はありません。')]));
  };
  body.push(h('h2', null, '全問の解答一覧'));
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': '表示' });
  const segBtns = [['all', 'すべて（' + R.qs.length + '）'], ['wrong', '間違い・未解答（' + wrongQs.length + '）']].map(p => {
    const b = h('button', { onclick: () => { onlyWrong = p[0] === 'wrong'; sync(); drawList(); } }, p[1]);
    b.dataset.k = p[0];
    return b;
  });
  const sync = () => segBtns.forEach(b => b.setAttribute('aria-pressed', String((b.dataset.k === 'wrong') === onlyWrong)));
  seg.append(...segBtns); sync();
  body.push(seg, listHost);
  drawList();

  screen({
    header: subHeader(isExam ? '採点結果' : '練習の結果', viewBack),
    body,
    bar: [
      h('button', { class: 'btn', onclick: viewBack }, 'ホームへ'),
      h('button', { class: 'btn primary', disabled: wrongQs.length === 0,
        onclick: () => startPractice('review', '解き直し', shuffle(wrongQs)) }, wrongQs.length ? '間違えた' + wrongQs.length + '問を解き直す' : '全問正解です')
    ]
  });
}

/* ==========================================================================
   9. 起動・キーボード・保存タイミング
   ========================================================================== */
document.addEventListener('keydown', e => {
  if (modalOpen || e.ctrlKey || e.metaKey || e.altKey) return;
  if (E && E.active) {
    if (e.key >= '1' && e.key <= '5') { setAnswer(parseInt(e.key, 10)); }
    else if (e.key === 'ArrowRight' && E.idx < E.qs.length - 1) goQ(E.idx + 1);
    else if (e.key === 'ArrowLeft' && E.idx > 0) goQ(E.idx - 1);
  } else if (P && P.active && !P.finished) {
    const q = P.qs[P.idx];
    if (e.key >= '1' && e.key <= '5' && P.answers[q.id] == null) answerPractice(parseInt(e.key, 10));
    else if ((e.key === 'ArrowRight' || e.key === 'Enter') && P.answers[q.id] != null && document.activeElement === document.body) nextPractice();
  }
});
document.addEventListener('visibilitychange', () => {
  if (!E || !E.active) return;
  if (document.hidden) saveSession(); else tick();
});
window.addEventListener('pagehide', () => { if (E && E.active) saveSession(); });

/* PWA: manifest を data URL で付与（http(s) 配信時のホーム画面追加用。file:// では不要） */
function setupManifest() {
  try {
    if (!/^https?:$/.test(location.protocol)) return;
    const base = location.href.split('#')[0];
    const manifest = {
