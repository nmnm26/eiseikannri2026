<style>
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface2:#eceff4; --text:#1b2330; --muted:#556070;
  --border:#cfd6df; --primary:#1f4e79; --on-primary:#ffffff; --primary-soft:#e2ecf7; --link:#1f4e79;
  --ok:#17622f; --ok-bg:#e4f3e8; --ok-border:#3a9a57;
  --ng:#a8231b; --ng-bg:#fdeceb; --ng-border:#d4544c;
  --warn:#7a4a00; --warn-bg:#fff2d2; --warn-border:#d19a14;
  --flag:#9a4300; --flag-bg:#ffe8d2;
  --shadow:0 1px 2px rgba(15,25,40,.08);
  --bar-h:68px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11151b; --surface:#1a2029; --surface2:#242c38; --text:#e7eaef; --muted:#a8b2c0;
    --border:#3a4554; --primary:#2f6aa3; --on-primary:#ffffff; --primary-soft:#1f3249; --link:#8fc0ee;
    --ok:#9fdcb0; --ok-bg:#15301f; --ok-border:#4ea86a;
    --ng:#ffb4ae; --ng-bg:#3a1a19; --ng-border:#d9645c;
    --warn:#ffd88a; --warn-bg:#3b2d0c; --warn-border:#c9921a;
    --flag:#ffc08a; --flag-bg:#432610;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,"Noto Sans JP",sans-serif;
  overflow-wrap:anywhere;word-break:normal;line-break:strict;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button,summary{cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:16px;padding-right:16px}
.main{padding-top:14px;padding-bottom:28px}
.main.has-bar{padding-bottom:calc(var(--bar-h) + 28px + env(safe-area-inset-bottom))}
h1,h2,h3{line-height:1.4;margin:0}
h2{font-size:18px;margin:26px 0 10px}
p{margin:0 0 .8em}
.muted{color:var(--muted)}
.small{font-size:14px}
.nowrap{white-space:nowrap}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top)}
.topbar-in{display:flex;align-items:center;gap:8px;min-height:52px}
.tb-mid{flex:1;min-width:0;font-weight:700;font-size:17px;line-height:1.3}
.tb-mid .tb-sub{font-weight:400;color:var(--muted);font-size:15px}
.tb-title{flex:1;font-weight:700;font-size:17px}
.icon-btn{min-width:48px;min-height:48px;margin-left:-10px;border:0;background:transparent;font-size:20px;border-radius:12px}
.icon-btn.txt{font-size:15px;margin-left:0;margin-right:-10px;padding:0 10px;font-weight:600;color:var(--link)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;padding:6px 12px;border-radius:10px;
  background:var(--surface2);border:2px solid transparent;white-space:nowrap}
.timer.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}
.timer.crit{background:var(--ng-bg);color:var(--ng);border-color:var(--ng-border)}
.progress{height:4px;background:var(--surface2)}
.progress>i{display:block;height:100%;background:var(--primary)}

/* cards, buttons */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin:0 0 12px}
.card h2:first-child,.card h3:first-child{margin-top:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;width:100%;
  border-radius:12px;border:2px solid var(--border);background:var(--surface);font-weight:700;text-align:center;line-height:1.4}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.danger{background:var(--ng-bg);border-color:var(--ng-border);color:var(--ng)}
.btn.link{background:transparent;border-color:transparent;color:var(--link);min-height:44px}
.btn.big{min-height:60px;font-size:17px}
.btn .sub{display:block;font-weight:400;font-size:13px;color:inherit;opacity:.85}
.btn-col{display:flex;flex-direction:column;align-items:center}
.row{display:flex;gap:10px}
.row>*{flex:1 1 0;min-width:0}
.stack>*+*{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--surface2);font-size:13px;line-height:1.6;font-weight:600}
.chip.stars{letter-spacing:1px}
.chip.cat{background:var(--primary-soft)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}

/* home */
.hero h1{font-size:21px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.fact{background:var(--surface2);border-radius:10px;padding:8px 6px;text-align:center;line-height:1.3}
.fact b{display:block;font-size:20px}
.fact span{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;font-size:14px;margin:0}
.kv dt{font-weight:600}
.kv dd{margin:0;color:var(--muted)}
.kv dd.num{text-align:right;font-variant-numeric:tabular-nums}
.hist{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:10px 12px;min-height:56px;margin:0 0 8px}
.hist .h-main{flex:1;min-width:0;line-height:1.5}
.hist .h-main small{display:block;color:var(--muted);font-size:13px}
.hist .h-score{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.4}
.hist .h-score small{display:block;font-size:13px;font-weight:700}
.pass-t{color:var(--ok)} .fail-t{color:var(--ng)}
.notice{border-radius:12px;padding:10px 14px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border);margin:0 0 12px;font-size:15px;line-height:1.6}

/* option cards (variant / category) */
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:14px;
  padding:12px 14px;margin:0 0 10px;min-height:56px}
.opt[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt b{display:block;font-size:17px}
.opt span{display:block;font-size:14px;color:var(--muted)}
.opt .mark{display:inline-block;font-weight:700;color:var(--link)}
.seg{display:flex;gap:0;border:2px solid var(--border);border-radius:12px;overflow:hidden;margin:0 0 12px}
.seg button{flex:1;min-height:44px;border:0;background:var(--surface);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}

/* question */
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.q-head .q-no{font-size:18px;font-weight:800}
.q-head .spacer{flex:1}
.flag-btn{min-height:44px;padding:4px 12px;border-radius:12px;border:2px solid var(--border);background:var(--surface);font-weight:700;font-size:15px}
.flag-btn[aria-pressed="true"]{background:var(--flag-bg);border-color:var(--warn-border);color:var(--flag)}
.q-text{white-space:pre-wrap;margin:6px 0 16px;font-size:16.5px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:8px;align-items:flex-start;width:100%;min-height:52px;padding:11px 12px;text-align:left;
  background:var(--surface);border:2px solid var(--border);border-radius:12px;line-height:1.7}
.choice .c-no{flex:none;font-weight:800;min-width:2.6em}
.choice .c-body{flex:1;min-width:0}
.choice .c-tx{display:block;white-space:pre-wrap}
.choice .c-badge{display:inline-block;margin-top:6px;font-size:13px;font-weight:800;padding:1px 10px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap;line-height:1.6}
.choice.in-exam{position:relative;padding-right:46px}
.choice.is-selected{border-color:var(--primary);background:var(--primary-soft);font-weight:700}
.choice.is-selected::after{content:"✓";position:absolute;right:11px;top:50%;transform:translateY(-50%);width:26px;height:26px;
  border:2px solid var(--link);border-radius:999px;color:var(--link);font-weight:900;font-size:15px;line-height:22px;text-align:center}
.choice.is-correct{border-color:var(--ok-border);background:var(--ok-bg);color:var(--text)}
.choice.is-correct .c-badge{color:var(--ok)}
.choice.is-wrong{border-color:var(--ng-border);background:var(--ng-bg)}
.choice.is-wrong .c-badge{color:var(--ng)}
.choice:disabled{opacity:1;color:var(--text);cursor:default}
div.choice{cursor:default}

.verdict{display:flex;align-items:center;gap:10px;border-radius:12px;padding:12px 14px;margin:14px 0 12px;font-size:18px;font-weight:800;
  border:2px solid;scroll-margin-top:70px;scroll-margin-bottom:calc(var(--bar-h) + 24px + env(safe-area-inset-bottom))}
.verdict.ok{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok)}
.verdict.ng{background:var(--ng-bg);border-color:var(--ng-border);color:var(--ng)}
.verdict small{font-size:15px;font-weight:700;margin-left:auto}
.explain h3{font-size:16px;margin:0 0 6px}
.explain .exp{white-space:pre-wrap;margin:0 0 14px}
.notes{list-style:none;margin:0 0 14px;padding:0}
.notes li{display:flex;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);margin:0 0 6px;font-size:15.5px;line-height:1.65}
.notes li.ans{border-color:var(--ok-border);background:var(--ok-bg)}
.notes li .n-no{flex:none;font-weight:800;min-width:2.6em}
.notes li .n-tx{flex:1;min-width:0;white-space:pre-wrap}
.ref{font-size:14px;color:var(--muted);margin:0}

/* bottom bar */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.bar-in{display:flex;gap:10px;align-items:stretch}
.bar-in .btn{min-height:52px;width:auto;flex:1 1 0}
.bar-in .btn.narrow{flex:0 0 28%}

/* overlays */
.back{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.back.sheet-mode{align-items:flex-end;padding:0}
.modal{width:100%;max-width:420px;background:var(--surface);border-radius:16px;padding:18px 18px 14px;border:1px solid var(--border);
  box-shadow:0 8px 30px rgba(0,0,0,.35);max-height:90vh;overflow:auto}
.modal h3{font-size:18px;margin:0 0 8px}
.modal p{white-space:pre-wrap}
.modal .acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sheet{width:100%;max-width:720px;background:var(--surface);border-radius:18px 18px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  max-height:86vh;overflow:auto;border:1px solid var(--border);border-bottom:0}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet-hd h3{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
@media (min-width:480px){.grid{grid-template-columns:repeat(8,1fr)}}
.gn{min-height:48px;border-radius:10px;border:2px solid var(--border);background:var(--surface);font-weight:700;font-size:16px;
  font-variant-numeric:tabular-nums;position:relative;line-height:1.2}
.gn.done{background:var(--primary-soft);border-color:var(--primary)}
.gn.flag{background:var(--flag-bg);border-color:var(--warn-border);color:var(--flag)}
.gn.cur{box-shadow:0 0 0 3px var(--link)}
.gn small{display:block;font-size:11px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:4px 0 10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid var(--border);vertical-align:-2px;margin-right:4px}
.legend i.done{background:var(--primary-soft);border-color:var(--primary)}
.legend i.flag{background:var(--flag-bg);border-color:var(--warn-border)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar-h) + 18px + env(safe-area-inset-bottom));z-index:60;
  background:#222b38;color:#fff;padding:10px 16px;border-radius:12px;max-width:min(92vw,520px);font-size:15px;line-height:1.5;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.35)}

/* result */
.score-card{border-radius:16px;padding:18px 16px;text-align:center;border:2px solid;margin:0 0 14px}
.score-card.pass{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok)}
.score-card.fail{background:var(--ng-bg);border-color:var(--ng-border);color:var(--ng)}
.score-card.neutral{background:var(--surface);border-color:var(--border);color:var(--text)}
.sc-verdict{font-size:30px;font-weight:900;letter-spacing:.1em;line-height:1.3}
.sc-score{font-size:46px;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums}
.sc-score small{font-size:20px;font-weight:700}
.sc-sub{font-size:15px;font-weight:600;color:var(--text)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;line-height:1.45;background:var(--surface);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:10px}
.tbl th{background:var(--surface2);font-weight:700;font-size:13px}
.tbl tr.bad td{background:var(--ng-bg);color:var(--ng);font-weight:700}
.tbl tr.tot td{font-weight:800;border-top:2px solid var(--border)}
.reasons{margin:10px 0 0;padding:0;list-style:none}
.reasons li{padding:8px 12px;border-radius:10px;margin:0 0 6px;font-size:15px;line-height:1.6}
.reasons li.ng{background:var(--ng-bg);color:var(--ng);border:1px solid var(--ng-border);font-weight:600}
.reasons li.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-border);font-weight:600}
details.item{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin:0 0 8px;overflow:hidden}
details.item.is-ng{border-color:var(--ng-border)}
details.item>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:52px;line-height:1.45}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary::after{content:"▸";margin-left:auto;color:var(--muted);transition:transform .15s}
details.item[open]>summary::after{transform:rotate(90deg)}
.it-no{font-weight:800;min-width:3em}
.it-mark{font-weight:800;white-space:nowrap}
.it-mark.ok{color:var(--ok)} .it-mark.ng{color:var(--ng)}
.it-ans{font-size:14px;color:var(--muted);flex:1;min-width:0}
.it-body{padding:4px 12px 14px;border-top:1px solid var(--border)}
.it-body .q-text{font-size:16px}

.site-footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);line-height:1.7}
.empty{padding:14px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (min-width:721px){.main{padding-top:22px}}
</style>
</head>

<script type="application/json" id="qdata">{"meta":{"title":"第一種衛生管理者 本番形式 予想問題集","version":"2026-10-12","note":"安全衛生技術試験協会の公表問題（令和7年7月～令和8年6月実施分）の出題傾向と、2026年10月時点の法令に基づいて作成したオリジナル予想問題。公表問題そのものの転載ではない。","exam":{"questions":44,"totalPoints":400,"timeMinutes":180,"format":"五肢択一式（正答は1問につき1つ）","passRule":"範囲ごとの得点が40%以上、かつ合計が60%（240点）以上","passLine":{"total":240,"law_h":32,"hyg_h":32,"law_g":28,"hyg_g":28,"phys":40},"variants":[{"name":"通常受験","questions":"問1～問44","timeMinutes":180},{"name":"労働生理免除者","questions":"問1～問34","timeMinutes":135,"passTotalPoints":300,"passTotal":180},{"name":"特例（第二種免許保有者）","questions":"問1～問20","timeMinutes":120,"passTotalPoints":160,"passTotal":96}]},"categories":{"law_h":{"name":"関係法令（有害業務に係るもの）","short":"法令・有害","points":8,"count":10,"range":[1,10]},"hyg_h":{"name":"労働衛生（有害業務に係るもの）","short":"衛生・有害","points":8,"count":10,"range":[11,20]},"law_g":{"name":"関係法令（有害業務に係るもの以外のもの）","short":"法令・一般","points":10,"count":7,"range":[21,27]},"hyg_g":{"name":"労働衛生（有害業務に係るもの以外のもの）","short":"衛生・一般","points":10,"count":7,"range":[28,34]},"phys":{"name":"労働生理","short":"生理","points":10,"count":10,"range":[35,44]}},"sets":{"A":"予想模試A","B":"予想模試B"},"officialPastExams":"https://www.exam.or.jp/lckohyo"},"questions":[{"id":"A01","set":"A","no":1,"cat":"law_h","topic":"衛生管理体制（選任）","freq":3,"q":"常時800人の労働者を使用する製造業の事業場における衛生管理体制に関する(1)～(5)の記述のうち、法令上、誤っているものはどれか。\nただし、800人中には、屋内作業場において次の業務に常時従事する者が含まれているが、その他の有害業務はないものとし、衛生管理者及び産業医の選任の特例はないものとする。\n・深夜業を含む業務　550人\n・多量の高熱物体を取り扱う業務　20人","choices":["総括安全衛生管理者を選任しなければならない。","産業医は、この事業場に専属の者を選任しなければならない。","衛生管理者のうち少なくとも1人を専任の衛生管理者としなければならない。","衛生管理者は、3人以上選任しなければならない。","衛生管理者のうち1人を衛生工学衛生管理者免許を受けた者のうちから選任する必要はない。"],"answer":3,"exp":"専任の衛生管理者が必要なのは「常時1,000人を超える」又は「常時500人を超え、かつ坑内労働又は労働基準法施行規則第18条各号の有害業務に常時30人以上従事」の場合。深夜業は労基則18条の業務に含まれず、多量の高熱物体の取扱いは20人で30人未満のため、専任は不要。","notes":["正しい。製造業は常時300人以上で総括安全衛生管理者の選任が必要。","正しい。深夜業を含む業務など一定の有害業務に常時500人以上従事する事業場は専属産業医が必要（安衛則13条）。深夜業550人で該当。","誤り（正答）。800人は1,000人以下で、労基則18条の業務（多量高熱）が30人未満のため専任は不要。","正しい。501～1,000人の事業場は衛生管理者3人以上（安衛則7条）。","正しい。衛生工学衛生管理者が必要なのは500人超かつ多量高熱等の特定業務に30人以上の場合。20人のため不要。"],"ref":"安衛則7条・13条、安衛令2条、労基則18条"},{"id":"A02","set":"A","no":2,"cat":"law_h","topic":"作業主任者の選任","freq":3,"q":"次の作業のうち、法令上、作業主任者の選任が義務付けられていないものはどれか。","choices":["鉛蓄電池を製造する工程において鉛等を加工する作業","水深10m以上の場所における潜水の作業","圧気工法により、大気圧を超える気圧下の作業室の内部において行う作業","酒類を入れたことのある醸造槽の内部における作業","製造工程において硝酸を用いて行う洗浄の作業"],"answer":2,"exp":"潜水業務は潜水士免許が必要な業務だが、「潜水作業主任者」という作業主任者の制度はない。","notes":["選任必要。鉛作業主任者（技能講習）。","選任不要（正答）。潜水士免許は必要だが、作業主任者の選任義務はない。","選任必要。高圧室内作業主任者（免許）。","選任必要。酒類を入れたことのある醸造槽内は酸素欠乏危険場所で、酸素欠乏危険作業主任者が必要。","選任必要。硝酸は特定化学物質（第三類）で、製造・取扱い作業（試験研究を除く）には特定化学物質作業主任者が必要。"],"ref":"安衛令6条"},{"id":"A03","set":"A","no":3,"cat":"law_h","topic":"特別教育","freq":3,"q":"次の業務に労働者を就かせるとき、法令に基づく安全又は衛生のための特別の教育（特別教育）を行わなければならないものに該当しないものはどれか。","choices":["石綿等が使用されている建築物の解体等の作業に係る業務","有機溶剤等を用いて行う接着の業務","酸素欠乏危険場所における作業に係る業務","特定粉じん作業に係る業務","廃棄物の焼却施設において焼却灰を取り扱う業務"],"answer":2,"exp":"有機溶剤業務には特別教育の規定はない（作業主任者や健康診断等で管理）。鉛業務、特定化学物質の取扱い、騒音作業なども特別教育の対象外である点が頻出。","notes":["該当する。石綿則27条。","該当しない（正答）。有機溶剤業務は特別教育の対象外。","該当する。酸欠則12条。","該当する。粉じん則22条（特定粉じん作業）。","該当する。ダイオキシン類に係る業務（安衛則36条）。"],"ref":"安衛法59条3項、安衛則36条"},{"id":"A04","set":"A","no":4,"cat":"law_h","topic":"健康診断記録の保存期間","freq":3,"q":"法令に基づく次の健康診断の結果の記録（個人票等）とその保存期間との組合せとして、誤っているものはどれか。","choices":["有機溶剤等健康診断個人票 ……… 5年間","電離放射線健康診断個人票 ……… 5年間","石綿健康診断個人票 ……… 当該労働者が当該事業場において常時石綿等を取り扱う業務に従事しないこととなった日から40年間","じん肺健康診断の記録 ……… 7年間","鉛健康診断個人票 ……… 5年間"],"answer":2,"exp":"電離放射線健康診断個人票は原則30年間保存（5年間保存後に厚生労働大臣が指定する機関に引き渡す場合を除く）。","notes":["正しい。有機則30条。","誤り（正答）。電離則57条により30年間。","正しい。石綿則40条。","正しい。じん肺法17条。","正しい。鉛則54条。"],"ref":"有機則30条、鉛則54条、石綿則40条、じん肺法17条、電離則57条"},{"id":"A05","set":"A","no":5,"cat":"law_h","topic":"作業環境測定の頻度","freq":3,"q":"法令に基づく作業環境測定とその測定頻度との組合せとして、誤っているものはどれか。","choices":["通気設備が設けられている坑内の作業場における通気量の測定 ……… 半月以内ごとに1回","第二種有機溶剤等を用いて洗浄の業務を行う屋内作業場における空気中の有機溶剤の濃度の測定 ……… 6か月以内ごとに1回","鉛ライニングの業務を行う屋内作業場における空気中の鉛の濃度の測定 ……… 1年以内ごとに1回","非密封の放射性物質を取り扱う作業室における空気中の放射性物質の濃度の測定 ……… 1か月以内ごとに1回","溶融ガラスからガラス製品を成型する業務を行う屋内作業場における気温、湿度及びふく射熱の測定 ……… 1か月以内ごとに1回"],"answer":5,"exp":"暑熱・寒冷・多湿の屋内作業場の気温・湿度・ふく射熱の測定は「半月以内ごとに1回」。","notes":["正しい。安衛則603条。","正しい。有機則28条。","正しい。鉛則52条。","正しい。電離則55条。","誤り（正答）。安衛則607条により半月以内ごとに1回。"],"ref":"安衛令21条、安衛則603条・607条ほか"},{"id":"A06","set":"A","no":6,"cat":"law_h","topic":"有機溶剤中毒予防規則","freq":3,"q":"屋内作業場において、第二種有機溶剤等を使用して常時塗装作業を行う場合の措置として、法令上、誤っているものは次のうちどれか。\nただし、有機溶剤中毒予防規則に定める適用除外及び設備の特例はないものとする。","choices":["有機溶剤等を入れたことのある空容器で有機溶剤の蒸気が発散するおそれのあるものは、屋内の一定の場所に集積しておく。","有機溶剤等の区分の色分けによる表示を黄色で行う。","作業場所に設けた局所排気装置について、外付け式フードの側方吸引型の場合は0.5m/sの制御風速を出し得る能力を有するものにする。","有機溶剤作業主任者に、局所排気装置を1か月を超えない期間ごとに点検させる。","作業場における空気中の有機溶剤の濃度の測定を行ったときは、その記録を3年間保存する。"],"answer":1,"exp":"有機溶剤等を入れてあった空容器で蒸気を発散するおそれのあるものは「密閉するか、又は屋外の一定の場所に集積」しなければならない。","notes":["誤り（正答）。屋内ではなく屋外（有機則36条）。","正しい。第一種＝赤、第二種＝黄、第三種＝青（有機則25条）。","正しい。囲い式0.4m/s、外付け式（側方・下方）0.5m/s、上方吸引型1.0m/s（有機則16条）。","正しい。有機則19条の2。","正しい。有機則28条。"],"ref":"有機則16条・19条の2・25条・28条・36条"},{"id":"A07","set":"A","no":7,"cat":"law_h","topic":"酸素欠乏症等防止規則","freq":3,"q":"酸素欠乏症等防止規則に関する次の記述のうち、誤っているものはどれか。","choices":["酸素欠乏危険作業を行う場所の換気を行うときは、純酸素を使用してはならない。","第一種酸素欠乏危険作業を行う作業場については、その日の作業を開始する前に、当該作業場における空気中の酸素の濃度を測定しなければならない。","第二種酸素欠乏危険作業に係る作業主任者は、酸素欠乏・硫化水素危険作業主任者技能講習を修了した者のうちから選任しなければならない。","酸素欠乏危険作業を行う作業場で酸素の濃度を測定したときは、その記録を1年間保存しなければならない。","酸素欠乏とは、空気中の酸素の濃度が18％未満である状態をいう。"],"answer":4,"exp":"酸素欠乏危険場所での測定記録は3年間保存。","notes":["正しい。酸欠則5条。","正しい。酸欠則3条。第二種では酸素及び硫化水素の濃度を測定。","正しい。酸欠則11条。第一種はどちらの技能講習修了者でもよい。","誤り（正答）。3年間（酸欠則3条2項）。","正しい。酸欠則2条。"],"ref":"酸欠則2条・3条・5条・11条"},{"id":"A08","set":"A","no":8,"cat":"law_h","topic":"女性の就業制限（労働基準法）","freq":2,"q":"労働基準法に基づき、満18歳以上の女性労働者（妊娠中の女性及び産後1年を経過しない女性を除く。）を就かせてはならない業務に該当するものは次のうちどれか。","choices":["病原体によって著しく汚染のおそれのある業務","削岩機、鋲打機等身体に著しい振動を与える機械器具を用いて行う業務","異常気圧下における業務","多量の高熱物体を取り扱う業務","20kg以上の重量物を継続作業として取り扱う業務"],"answer":5,"exp":"妊産婦以外の満18歳以上の女性にも禁止されるのは、重量物（断続作業30kg以上・継続作業20kg以上）の取扱いと、鉛・水銀等の一定の有害物を発散する場所での業務。","notes":["該当しない。女性則の就業制限業務ではない。","該当しない。妊産婦は禁止だが一般女性は対象外。","該当しない。妊娠中の女性は禁止、産後1年未満は申出により禁止。","該当しない。同上（妊産婦に関する制限）。","該当する（正答）。女性則2条・3条。"],"ref":"労基法64条の3、女性労働基準規則2条・3条"},{"id":"A09","set":"A","no":9,"cat":"law_h","topic":"譲渡等の制限（規格具備）","freq":2,"q":"厚生労働大臣が定める規格を具備しなければ、譲渡し、貸与し、又は設置してはならない機械等に該当するものは、次のうちどれか。","choices":["一酸化炭素用防毒マスク","硫化水素用防毒マスク","防音保護具","防振手袋","化学防護手袋"],"answer":1,"exp":"規格具備が義務付けられる防毒マスクは、ハロゲンガス用、有機ガス用、一酸化炭素用、アンモニア用、亜硫酸ガス用に限られる。ほかに防じんマスク（ろ過材及び面体を有するもの）、電動ファン付き呼吸用保護具なども対象。","notes":["該当する（正答）。","該当しない。硫化水素用は規格具備の対象外。","該当しない。","該当しない。","該当しない。"],"ref":"安衛法42条、安衛令13条"},{"id":"A10","set":"A","no":10,"cat":"law_h","topic":"化学物質の自律的管理（化学物質管理者等）","freq":3,"q":"労働安全衛生規則に規定される化学物質管理者又は保護具着用管理責任者に関する次の記述のうち、法令上、誤っているものはどれか。","choices":["リスクアセスメントの結果等の記録は、原則として次にリスクアセスメントを行うまでの期間（その期間が3年以内である場合は3年間）保存しなければならない。","リスクアセスメント対象物を製造する事業場においては、厚生労働大臣が定める化学物質の管理に関する講習を修了した者等のうちから化学物質管理者を選任しなければならない。","リスクアセスメント対象物を製造し、又は取り扱う事業場ごとに、化学物質管理者を選任しなければならない。","保護具着用管理責任者は、選任すべき事由が発生した日から14日以内に選任しなければならない。","化学物質管理者を選任したときは、遅滞なく、選任報告書を所轄労働基準監督署長に提出しなければならない。"],"answer":5,"exp":"化学物質管理者・保護具着用管理責任者は、労働基準監督署長への選任報告は不要。氏名を事業場の見やすい箇所に掲示する等により関係労働者に周知しなければならない。","notes":["正しい。安衛則34条の2の8。","正しい。製造事業場は専門的講習修了者等から選任。","正しい。安衛則12条の5。","正しい。安衛則12条の6。","誤り（正答）。報告義務はなく、周知義務がある。"],"ref":"安衛則12条の5・12条の6・34条の2の8"},{"id":"A11","set":"A","no":11,"cat":"hyg_h","topic":"化学物質の空気中での状態","freq":3,"q":"化学物質とその常温・常圧（25℃、1気圧）の空気中における状態との組合せとして、誤っているものは次のうちどれか。\nただし、ガスとは、常温・常圧で気体のものをいい、蒸気とは、常温・常圧で液体又は固体の物質が蒸気圧に応じて揮発又は昇華して気体となっているものをいうものとする。","choices":["トルエン ……… 蒸気","アンモニア ……… 蒸気","二硫化炭素 ……… 蒸気","塩素 ……… ガス","ジクロロベンジジン ……… 粉じん"],"answer":2,"exp":"アンモニアは常温・常圧で気体なので「ガス」。ガスの代表例：塩素、アンモニア、一酸化炭素、硫化水素、二酸化硫黄、ホルムアルデヒド、塩化ビニル、エチレンオキシド。蒸気の代表例：アクリロニトリル、二硫化炭素、水銀、トルエン、トリクロロエチレン。","notes":["正しい。","誤り（正答）。アンモニアはガス。","正しい。二硫化炭素は常温で液体。","正しい。","正しい。常温で固体の微粒子として存在。"],"ref":"労働衛生のしおり等（有害物質の存在様式）"},{"id":"A12","set":"A","no":12,"cat":"hyg_h","topic":"リスク低減措置の優先順位","freq":3,"q":"厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」において、リスクアセスメントの結果に基づき法令に定められた措置以外の措置を検討する場合、次のアからエの措置について、優先度の高い順に並べたものは(1)～(5)のうちどれか。\nア 危険性又は有害性のより低い物質への代替\nイ 局所排気装置の設置等の衛生工学的対策\nウ 作業手順の改善、立入禁止等の管理的対策\nエ 化学物質等の有害性に応じた有効な保護具の使用","choices":["ア → イ → ウ → エ","ア → ウ → イ → エ","イ → ア → ウ → エ","イ → ウ → ア → エ","ウ → ア → イ → エ"],"answer":1,"exp":"優先順位は、①代替・運転条件の変更等（本質的対策）→②工学的・衛生工学的対策→③管理的対策→④保護具の使用。","notes":["正しい（正答）。","誤り。管理的対策より衛生工学的対策が優先。","誤り。代替が最優先。","誤り。","誤り。"],"ref":"化学物質リスクアセスメント指針"},{"id":"A13","set":"A","no":13,"cat":"hyg_h","topic":"化学物質による健康障害","freq":3,"q":"化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。","choices":["塩素による中毒では、咽頭痛、咳、胸苦しさなどの症状がみられ、重症になると肺水腫を起こすことがある。","ベンゼンによる健康障害では、長期間のばく露によって末梢神経障害がみられ、造血器障害はみられない。","シアン化水素による中毒では、細胞内での酸素利用の障害による呼吸困難、けいれんなどがみられる。","一酸化炭素は、赤血球中のヘモグロビンと強く結合し、その親和性は酸素の200倍以上である。","ノルマルヘキサンによる健康障害では、末梢神経障害がみられる。"],"answer":2,"exp":"ベンゼンの慢性中毒の特徴は造血器障害（再生不良性貧血、白血病）。","notes":["正しい。","誤り（正答）。ベンゼンは造血器障害・白血病が特徴。","正しい。","正しい。","正しい。多発性神経炎（末梢神経障害）。"],"ref":"労働衛生（有害業務）テキスト"},{"id":"A14","set":"A","no":14,"cat":"hyg_h","topic":"金属による健康障害","freq":3,"q":"金属などによる健康障害に関する次の記述のうち、正しいものはどれか。","choices":["マンガン中毒では、指の骨の溶解、皮膚の硬化などがみられる。","カドミウム中毒では、急性では上気道炎や肺炎、慢性では肺気腫や腎機能障害がみられる。","ベリリウム中毒では、溶血性貧血、尿の赤色化などの症状がみられる。","鉛中毒では、骨の硬化、斑状歯などがみられる。","金属水銀中毒では、鼻中隔穿孔がみられる。"],"answer":2,"exp":"カドミウム：上気道炎・肺炎・肺気腫・腎障害。鉛：貧血・伸筋麻痺・腹部の疝痛。マンガン：パーキンソン病様症状。ベリリウム：接触皮膚炎・肺炎・ベリリウム肺。金属水銀：手指の震え・精神障害。","notes":["誤り。指の骨の溶解・皮膚の硬化は塩化ビニル。マンガンは歩行障害等のパーキンソン病様症状。","正しい（正答）。","誤り。溶血性貧血・尿の赤色化は砒化水素（アルシン）。","誤り。骨の硬化・斑状歯は弗素（弗化水素）の慢性中毒。","誤り。鼻中隔穿孔はクロム。"],"ref":"労働衛生（有害業務）テキスト"},{"id":"A15","set":"A","no":15,"cat":"hyg_h","topic":"じん肺","freq":3,"q":"じん肺に関する次の記述のうち、誤っているものはどれか。","choices":["じん肺は、粉じんへのばく露を中止した後も進行することがある。","けい肺は、遊離けい酸の粉じんを吸入することによって起こるじん肺である。","じん肺法で定めるじん肺の合併症は、肺結核のみである。","じん肺は、自覚症状が現れないまま進行することもあるが、進行すると咳、痰、呼吸困難などがみられる。","じん肺は、粉じんを吸入することによって肺に生じた線維増殖性変化を主体とする疾病である。"],"answer":3,"exp":"じん肺法の合併症は、肺結核、結核性胸膜炎、続発性気管支炎、続発性気管支拡張症、続発性気胸、原発性肺がん。","notes":["正しい。","正しい。","誤り（正答）。合併症は6種類。","正しい。","正しい。"],"ref":"じん肺法2条、じん肺法施行規則1条"},{"id":"A16","set":"A","no":16,"cat":"hyg_h","topic":"有害エネルギーによる健康障害","freq":3,"q":"作業環境における有害要因による健康障害に関する次の記述のうち、正しいものはどれか。","choices":["減圧症は、浮上による減圧に伴い、血液中に溶け込んでいた酸素が気泡となることにより発生する。","熱けいれんは、高温環境下で体温調節中枢が障害されることにより発生する。","電離放射線の被ばくによる白内障は、晩発障害に分類され、確定的影響である。","騒音性難聴は、初期には会話音域である500～2,000Hz付近の聴力低下から始まる。","振動障害のレイノー現象は、暖かい季節に起こりやすい。"],"answer":3,"exp":"白内障は晩発障害かつ確定的影響（しきい値があり、線量が増えると重症度が増す）。","notes":["誤り。気泡となるのは窒素。","誤り。熱けいれんは、大量発汗で失った塩分を補給せず水分のみ補給した場合に起こる筋肉のけいれん。","正しい（正答）。","誤り。初期は4,000Hz付近（c5dip）の聴力低下。","誤り。冬季など寒冷時に起こりやすい。"],"ref":"労働衛生（有害業務）テキスト"},{"id":"A17","set":"A","no":17,"cat":"hyg_h","topic":"作業環境測定・評価","freq":3,"q":"厚生労働省の「作業環境測定基準」及び「作業環境評価基準」に基づく作業環境測定及びその結果の評価に関する次の記述のうち、正しいものはどれか。","choices":["管理濃度は、個々の労働者のばく露限界として設定されたものである。","A測定の第二評価値が管理濃度を超えていても、B測定の測定値が管理濃度以下であれば、第二管理区分となる。","B測定の測定値が管理濃度の1.5倍を超えている単位作業場所の管理区分は、A測定の結果に関係なく第三管理区分となる。","A測定の第一評価値は、単位作業場所における気中有害物質の算術平均濃度の推定値である。","A測定の測定点の数は、単位作業場所について原則として3以上とする。"],"answer":3,"exp":"第三管理区分になるのは「A測定の第二評価値＞管理濃度」又は「B測定値＞管理濃度×1.5」の場合。","notes":["誤り。管理濃度は作業環境管理の良否を判断するための行政上の指標で、個人ばく露限界ではない。","誤り。第二評価値が管理濃度を超えれば第三管理区分。","正しい（正答）。","誤り。第一評価値は高濃度側から5％に相当する濃度の推定値。算術平均濃度の推定値は第二評価値。","誤り。原則5以上。"],"ref":"作業環境測定基準、作業環境評価基準"},{"id":"A18","set":"A","no":18,"cat":"hyg_h","topic":"局所排気装置","freq":3,"q":"局所排気装置に関する次の記述のうち、正しいものはどれか。","choices":["ダクトは、曲がり部分を多くするほど圧力損失が小さくなる。","主ダクトと枝ダクトとの合流角度は、90°以上とするのがよい。","空気清浄装置を付設する局所排気装置の排風機は、空気清浄装置の前（上流側）に設置する。","スロット型フードは、外付け式フードに分類される。","フードの型式のうち、一般に、最も少ない排風量で効果を得られるのは外付け式フードである。"],"answer":4,"exp":"フード分類：囲い式（カバー型、グローブボックス型、ドラフトチェンバ型、建築ブース型）、外付け式（スロット型、ルーバ型、グリッド型、円形・長方形型）、レシーバ式（キャノピ型、グラインダー型）。","notes":["誤り。曲がりが多いほど圧力損失は大きい。","誤り。合流角度は45°を超えないようにする。","誤り。排風機は清浄後の空気が通る位置（後ろ）に設ける。","正しい（正答）。","誤り。囲い式が最も効果的で排風量も少なくて済む。"],"ref":"労働衛生工学（局所排気装置）"},{"id":"A19","set":"A","no":19,"cat":"hyg_h","topic":"呼吸用保護具","freq":3,"q":"呼吸用保護具に関する次の記述のうち、誤っているものはどれか。","choices":["防じんマスクの面体と顔面との間にタオル等を当てて使用してはならない。","一酸化炭素用防毒マスクの吸収缶の色は、赤色である。","2種類以上の有害ガスが混在している場合には、それぞれのガスに有効な防毒マスクを選ぶか、送気マスク等を使用する。","酸素濃度18％未満の場所では、防じんマスク及び防毒マスクを使用してはならない。","型式検定合格標章のある防じんマスクであっても、ヒュームのような微細な粒子に対しては使用してはならない。"],"answer":5,"exp":"型式検定に合格した防じんマスクはヒュームにも使用できる。吸収缶の色：有機ガス用＝黒、一酸化炭素用＝赤、アンモニア用＝緑、硫化水素用＝黄、亜硫酸ガス用＝黄赤。","notes":["正しい。密着性が損なわれる。","正しい。","正しい。最も毒性の強いガス用だけでは不十分。","正しい。酸素欠乏の場所では給気式（送気マスク、空気呼吸器等）を使う。","誤り（正答）。ヒュームにも使用可。"],"ref":"防じん・防毒マスクの選択、使用等について（通達）"},{"id":"A20","set":"A","no":20,"cat":"hyg_h","topic":"生物学的モニタリング","freq":3,"q":"有害化学物質とその生物学的モニタリングの指標として用いられる尿中の代謝物等との組合せとして、誤っているものは次のうちどれか。","choices":["キシレン ……… メチル馬尿酸","鉛 ……… デルタアミノレブリン酸","N,N-ジメチルホルムアミド ……… マンデル酸","ノルマルヘキサン ……… 2,5-ヘキサンジオン","1,1,1-トリクロロエタン ……… 総三塩化物"],"answer":3,"exp":"N,N-ジメチルホルムアミドの指標は尿中のN-メチルホルムアミド。マンデル酸（及びフェニルグリオキシル酸）はスチレンの指標。","notes":["正しい。","正しい。","誤り（正答）。","正しい。","正しい。"],"ref":"有機則・鉛則の特殊健康診断項目"},{"id":"A21","set":"A","no":21,"cat":"law_g","topic":"衛生管理者","freq":3,"q":"衛生管理者に関する次の記述のうち、法令上、誤っているものはどれか。\nただし、衛生管理者の選任の特例はないものとする。","choices":["2人以上の衛生管理者を選任する場合において、その中に労働衛生コンサルタントがいるときは、そのうち1人については事業場に専属の者でなくてもよい。","衛生管理者は、選任すべき事由が発生した日から14日以内に選任しなければならない。","衛生管理者は、少なくとも毎週1回作業場等を巡視し、設備、作業方法又は衛生状態に有害のおそれがあるときは、直ちに、必要な措置を講じなければならない。","常時300人の労働者を使用する事業場では、衛生管理者を1人選任すれば足りる。","衛生管理者を選任したときは、遅滞なく、選任報告書を所轄労働基準監督署長に提出しなければならない。"],"answer":4,"exp":"衛生管理者の選任数：50～200人→1人、201～500人→2人、501～1,000人→3人、1,001～2,000人→4人、2,001～3,000人→5人、3,001人以上→6人。","notes":["正しい。安衛則7条1項2号。","正しい。安衛則7条。","正しい。安衛則11条。","誤り（正答）。300人なら2人以上必要。","正しい。安衛則7条2項。"],"ref":"安衛則7条・11条"},{"id":"A22","set":"A","no":22,"cat":"law_g","topic":"衛生委員会","freq":3,"q":"衛生委員会に関する次の記述のうち、法令上、誤っているものはどれか。","choices":["衛生管理者として選任しているが事業場に専属でない労働衛生コンサルタントを、衛生委員会の委員として指名することができる。","衛生委員会における議事で重要なものに係る記録を作成して、これを5年間保存しなければならない。","当該事業場の労働者で、作業環境測定を実施している作業環境測定士を、衛生委員会の委員として指名することができる。","衛生委員会は、毎月1回以上開催するようにしなければならない。","衛生委員会の議長は、総括安全衛生管理者又は総括安全衛生管理者以外の者で事業場においてその事業の実施を統括管理するもの若しくはこれに準ずる者のうちから、事業者が指名した者である。"],"answer":2,"exp":"衛生委員会の重要な議事の記録は3年間保存。","notes":["正しい。","誤り（正答）。3年間（安衛則23条4項）。","正しい。安衛法18条3項。","正しい。安衛則23条。","正しい。安衛法18条。"],"ref":"安衛法18条、安衛則23条"},{"id":"A23","set":"A","no":23,"cat":"law_g","topic":"一般健康診断","freq":3,"q":"労働安全衛生規則に基づく医師による健康診断に関する次の記述のうち、誤っているものはどれか。","choices":["定期健康診断の結果に基づき健康診断個人票を作成して、これを5年間保存しなければならない。","雇入時の健康診断の結果は、常時使用する労働者数にかかわらず、遅滞なく、所轄労働基準監督署長に報告しなければならない。","労働者を本邦外の地域に6か月以上派遣しようとするときは、あらかじめ、所定の項目について医師による健康診断を行わなければならない。","雇入時の健康診断において、医師による健康診断を受けた後3か月を経過しない者が、その結果を証明する書面を提出したときは、その健康診断の項目に相当する項目を省略することができる。","深夜業を含む業務に常時従事する労働者に対し、当該業務への配置替えの際及び6か月以内ごとに1回、定期に、健康診断を行わなければならない。"],"answer":2,"exp":"所轄労働基準監督署長への報告義務があるのは、常時50人以上の事業場における定期健康診断（特定業務従事者健診を含む）。雇入時の健康診断は報告不要。","notes":["正しい。安衛則51条。","誤り（正答）。雇入時健診は報告不要。","正しい。安衛則45条の2。","正しい。安衛則43条。","正しい。特定業務従事者の健康診断（安衛則45条）。"],"ref":"安衛則43条・45条・45条の2・51条・52条"},{"id":"A24","set":"A","no":24,"cat":"law_g","topic":"長時間労働者の面接指導","freq":3,"q":"労働時間の状況等が一定の要件に該当する労働者に対して、法令により実施することとされている医師による面接指導に関する次の記述のうち、誤っているものはどれか。","choices":["新たな技術、商品又は役務の研究開発に係る業務に従事する労働者で、その超えた時間が1か月当たり100時間を超えたものに対しては、申出の有無にかかわらず面接指導を行わなければならない。","休憩時間を除き1週間当たり40時間を超えて労働させた場合におけるその超えた時間が1か月当たり80時間を超え、かつ、疲労の蓄積が認められる者が申し出たときは、面接指導を行わなければならない。","事業者は、面接指導の結果に基づき、必要な措置について、面接指導が行われた日から3か月以内に、医師の意見を聴かなければならない。","事業者は、面接指導の結果に基づき、その記録を作成して、これを5年間保存しなければならない。","事業者は、1か月当たり80時間を超えた労働者に対し、速やかに、当該超えた時間に関する情報を通知しなければならない。"],"answer":3,"exp":"医師の意見聴取は「面接指導が行われた後、遅滞なく」行う。なお、健康診断の有所見者に係る医師の意見聴取は「健康診断が行われた日から3か月以内」なので混同に注意。","notes":["正しい。安衛法66条の8の2。","正しい。安衛則52条の2・52条の3。","誤り（正答）。遅滞なく（安衛則52条の7）。","正しい。安衛則52条の6。","正しい。安衛則52条の2第3項。"],"ref":"安衛法66条の8・66条の8の2、安衛則52条の2～52条の7"},{"id":"A25","set":"A","no":25,"cat":"law_g","topic":"事務所衛生基準規則","freq":3,"q":"事務室の空気環境の調整に関する次の記述のうち、事務所衛生基準規則上、誤っているものはどれか。","choices":["空気調和設備を設けている場合は、室の気温が18℃以上28℃以下及び相対湿度が40％以上70％以下になるように努めなければならない。","機械による換気のための設備については、2か月以内ごとに1回、定期に、異常の有無を点検しなければならない。","中央管理方式の空気調和設備を設けた建築物内の事務室については、原則として、2か月以内ごとに1回、定期に、一酸化炭素及び二酸化炭素の含有率、室温及び外気温並びに相対湿度を測定しなければならない。","空気調和設備内に設けられた排水受けについては、原則として、6か月以内ごとに1回、定期に、その汚れ及び閉塞の状況を点検しなければならない。","空気調和設備又は機械換気設備を設けている場合は、室に流入する空気が特定の労働者に直接、継続して及ばず、かつ、室の気流を0.5m/s以下としなければならない。"],"answer":4,"exp":"排水受け、冷却塔、加湿装置の汚れ等の点検は原則1か月以内ごとに1回。冷却塔・冷却水の水管・加湿装置の清掃は1年以内ごとに1回。","notes":["正しい。事務所則5条3項（令和4年4月から下限17℃→18℃）。","正しい。事務所則9条。","正しい。事務所則7条。","誤り（正答）。1か月以内ごとに1回（事務所則9条の2）。","正しい。事務所則5条2項。"],"ref":"事務所則5条・7条・9条・9条の2"},{"id":"A26","set":"A","no":26,"cat":"law_g","topic":"妊産婦等（労働基準法）","freq":3,"q":"労働基準法に定める妊産婦等に関する次の記述のうち、法令上、誤っているものはどれか。","choices":["生後満1年に達しない生児を育てる女性は、法定の休憩時間のほか、1日2回各々少なくとも30分、その生児を育てるための時間を請求することができる。","使用者は、6週間（多胎妊娠の場合は14週間）以内に出産する予定の女性が休業を請求した場合においては、その者を就業させてはならない。","育児時間は、生後満1年に達しない生児を育てる男性労働者も請求することができる。","使用者は、妊産婦が請求した場合においては、深夜業をさせてはならない。","使用者は、産後8週間を経過しない女性を就業させてはならないが、産後6週間を経過した女性が請求した場合において、その者について医師が支障がないと認めた業務に就かせることは差し支えない。"],"answer":3,"exp":"労働基準法67条の育児時間は「女性」のみが対象。なお、妊産婦とは妊娠中の女性及び産後1年を経過しない女性をいう。","notes":["正しい。労基法67条。","正しい。労基法65条1項。","誤り（正答）。育児時間の請求権者は女性のみ。","正しい。労基法66条3項。","正しい。労基法65条2項。"],"ref":"労基法65条～67条"},{"id":"A27","set":"A","no":27,"cat":"law_g","topic":"年次有給休暇（比例付与）","freq":3,"q":"週所定労働時間が25時間、週所定労働日数が4日である労働者であって、雇入れの日から起算して3年6か月継続勤務したものに対して、その後1年間に新たに与えなければならない年次有給休暇日数として、法令上、正しいものは次のうちどれか。\nただし、その労働者はその直前の1年間に全労働日の8割以上出勤したものとする。","choices":["8日","9日","10日","11日","12日"],"answer":3,"exp":"週4日（週30時間未満）の比例付与日数は、勤続0.5年7日→1.5年8日→2.5年9日→3.5年10日→4.5年12日→5.5年13日→6.5年以上15日。","notes":["誤り。1.5年の日数。","誤り。2.5年の日数。","正しい（正答）。","誤り。","誤り。4.5年の日数。"],"ref":"労基法39条3項、労基則24条の3"},{"id":"A28","set":"A","no":28,"cat":"hyg_g","topic":"必要換気量の計算","freq":3,"q":"事務室内において、空気を外気と入れ換えて二酸化炭素濃度を1,000ppm以下に保った状態で、在室者15人が執務するときに必要な最小の換気量（m³/h）は次のうちどれか。\nただし、外気の二酸化炭素濃度を400ppm、在室者1人当たりの呼出二酸化炭素量を0.018m³/hとする。","choices":["300m³/h","350m³/h","400m³/h","450m³/h","500m³/h"],"answer":4,"exp":"必要換気量(m³/h)＝在室者全員の呼出CO₂量(m³/h)÷（室内CO₂基準濃度－外気CO₂濃度）×1,000,000。\n0.018×15＝0.27、0.27÷(1,000－400)×1,000,000＝450m³/h。","notes":["誤り。","誤り。","誤り。","正しい（正答）。","誤り。"],"ref":"必要換気量の計算式"},{"id":"A29","set":"A","no":29,"cat":"hyg_g","topic":"温熱環境・WBGT","freq":3,"q":"温熱条件に関する次の記述のうち、誤っているものはどれか。","choices":["屋外で太陽照射のある場所のWBGTは、0.7×自然湿球温度＋0.2×黒球温度＋0.1×乾球温度で求められる。","実効温度は、人の温熱感に基礎を置いた指標で、気温、湿度及び気流の総合効果を温度目盛りで表したものである。","屋内及び屋外で太陽照射のない場所のWBGTは、0.7×自然湿球温度＋0.3×黒球温度で求められる。","至適温度は、作業強度や作業時間、年齢、被服などによって異なる。","WBGT基準値は、暑熱順化者に用いる値の方が、暑熱非順化者に用いる値より小さい。"],"answer":5,"exp":"暑熱順化者の方が暑さへの耐性が高いため、WBGT基準値は大きい（高い）値になる。また、身体作業強度が強いほど基準値は小さくなる。算出したWBGTが基準値を超える場合に熱中症のリスクが高まる。","notes":["正しい。","正しい。ふく射熱は含まない。","正しい。","正しい。","誤り（正答）。順化者の方が大きい。"],"ref":"JIS Z 8504、職場における熱中症予防基本対策要綱"},{"id":"A30","set":"A","no":30,"cat":"hyg_g","topic":"情報機器作業ガイドライン","freq":3,"q":"厚生労働省の「情報機器作業における労働衛生管理のためのガイドライン」に関する次の記述のうち、適切でないものはどれか。","choices":["ディスプレイは、その画面の上端が眼の高さとほぼ同じか、やや下になる高さにすることが望ましい。","ディスプレイは、おおむね40cm以上の視距離が確保できるようにする。","ディスプレイ画面の明るさ、書類及びキーボード面における明るさと周辺の明るさの差は、なるべく小さくする。","ディスプレイを用いる場合の書類上及びキーボード上における照度は、150ルクス以上を目安とする。","一連続作業時間が1時間を超えないようにし、次の連続作業までの間に10分～15分の作業休止時間を設け、かつ、一連続作業時間内において1回～2回程度の小休止を設ける。"],"answer":4,"exp":"書類上及びキーボード上の照度は300ルクス以上（令和3年12月の改正で「ディスプレイ画面上は500ルクス以下」の目安は削除された）。","notes":["適切。","適切。","適切。","不適切（正答）。300ルクス以上。","適切。"],"ref":"情報機器作業における労働衛生管理のためのガイドライン（令和元年7月、令和3年12月一部改正）"},{"id":"A31","set":"A","no":31,"cat":"hyg_g","topic":"メンタルヘルス指針","freq":3,"q":"厚生労働省の「労働者の心の健康の保持増進のための指針」に基づくメンタルヘルス対策に関する次の記述のうち、適切でないものはどれか。","choices":["心の健康づくり計画の策定に当たっては、衛生委員会等において十分調査審議を行う。","ラインによるケアでは、管理監督者が職場環境等の把握と改善、労働者からの相談対応を行うことが重要である。","メンタルヘルスケアは、心の健康問題の未然防止（一次予防）、早期発見と適切な措置（二次予防）、職場復帰の支援（三次予防）が円滑に行われるようにする必要がある。","労働者の心の健康は職場の問題のみに起因するため、家庭・個人生活等の職場外のストレス要因については考慮する必要はない。","メンタルヘルスケアは、「セルフケア」、「ラインによるケア」、「事業場内産業保健スタッフ等によるケア」及び「事業場外資源によるケア」の四つのケアを継続的かつ計画的に行う。"],"answer":4,"exp":"指針は、心の健康は職場配置等の人事労務管理と密接に関係するほか、家庭・個人生活等の職場外の問題の影響を受けている場合も多いことに留意するよう求めている。","notes":["適切。","適切。","適切。","不適切（正答）。職場外の要因の影響にも留意する。","適切。"],"ref":"労働者の心の健康の保持増進のための指針"},{"id":"A32","set":"A","no":32,"cat":"hyg_g","topic":"一次救命処置","freq":3,"q":"一次救命処置に関する次の記述のうち、誤っているものはどれか。","choices":["呼吸の確認は、10秒以内で行う。","人工呼吸を行う意思と技術がある場合は、胸骨圧迫30回と人工呼吸2回を繰り返す。","AEDによる電気ショックを行った後は、AEDが再び心電図を解析するまで胸骨圧迫は行わずに待つ。","胸骨圧迫は、胸が約5cm沈む強さで、胸骨の下半分を、1分間に100～120回のテンポで行う。","傷病者に反応がなく、呼吸がないか、普段どおりではない呼吸（死戦期呼吸）がみられる場合は、心停止とみなし、直ちに胸骨圧迫を開始する。"],"answer":3,"exp":"電気ショックの後は、ただちに胸骨圧迫から心肺蘇生を再開する（AEDは約2分ごとに自動で心電図を解析する）。","notes":["正しい。","正しい。","誤り（正答）。ショック後は直ちに胸骨圧迫を再開。","正しい。胸骨の「上半分」ではなく「下半分」。","正しい。"],"ref":"JRC蘇生ガイドライン、救急蘇生法の指針（市民用）"},{"id":"A33","set":"A","no":33,"cat":"hyg_g","topic":"食中毒","freq":3,"q":"食中毒に関する次の記述のうち、正しいものはどれか。","choices":["黄色ブドウ球菌が産生する毒素（エンテロトキシン）は、熱に強い。","サルモネラ菌による食中毒は、食品に付着した細菌が産生した毒素によって起こる毒素型食中毒である。","ボツリヌス菌は、酸素のある環境でよく増殖する好気性の菌である。","腸炎ビブリオ菌は、病原性好塩菌ともいわれ、熱に強い。","ノロウイルスによる食中毒は、夏季に多く発生し、潜伏期間は1週間程度である。"],"answer":1,"exp":"毒素型：黄色ブドウ球菌、ボツリヌス菌。感染型：サルモネラ菌、腸炎ビブリオ菌、カンピロバクター。黄色ブドウ球菌の毒素は加熱しても分解されにくい。","notes":["正しい（正答）。","誤り。サルモネラ菌は感染型。","誤り。ボツリヌス菌は嫌気性で、神経毒を産生する。","誤り。腸炎ビブリオ菌は熱に弱い。","誤り。ノロウイルスは冬季に多く、潜伏期間は1～2日。"],"ref":"労働衛生（一般）テキスト"},{"id":"A34","set":"A","no":34,"cat":"hyg_g","topic":"労働衛生統計","freq":3,"q":"労働衛生管理に用いられる統計に関する次の記述のうち、誤っているものはどれか。","choices":["ある時点での検査における有所見者の割合を発生率といい、一定期間に有所見とされた者の割合を有所見率という。","集団を比較する場合、調査の対象とした項目のデータの平均値が等しくても分散が異なっていれば、異なった特徴をもつ集団であると評価される。","ある時点の集団に関するデータを静態データといい、ある期間の集団に関するデータを動態データという。","健康診断においてスクリーニングレベルを低く設定すると、有所見者と判定される人が増え、偽陽性率は高く、偽陰性率は低くなる。","ある事象と健康事象との間に、統計上、相関関係が認められたとしても、それらの間に因果関係があるとは限らない。"],"answer":1,"exp":"ある時点での有所見者の割合は「有所見率」（静態データ）、一定期間に新たに発生した有所見者の割合は「発生率」（動態データ）。","notes":["誤り（正答）。定義が逆。","正しい。","正しい。","正しい。","正しい。"],"ref":"労働衛生統計"},{"id":"A35","set":"A","no":35,"cat":"phys","topic":"神経系","freq":3,"q":"神経系に関する次の記述のうち、誤っているものはどれか。","choices":["中枢神経系は、脳と脊髄から成る。","有髄神経線維は、無髄神経線維より神経伝導速度が速い。","神経系を構成する基本的な単位である神経細胞は、通常、1個の細胞体、1本の軸索及び複数の樹状突起から成り、ニューロンともいわれる。","体性神経は運動及び感覚に関与し、自律神経は呼吸、循環などに関与する。","交感神経系は、心拍数を減少させ、消化管の運動を亢進させる。"],"answer":5,"exp":"交感神経は身体を活動・緊張状態にする（心拍数増加、血圧上昇、消化管運動抑制）。副交感神経は心拍数減少、消化管運動亢進。","notes":["正しい。","正しい。","正しい。","正しい。","誤り（正答）。記述は副交感神経の作用。"],"ref":"労働生理テキスト"},{"id":"A36","set":"A","no":36,"cat":"phys","topic":"心臓・血液循環","freq":3,"q":"心臓及び血液循環に関する次の記述のうち、誤っているものはどれか。","choices":["肺循環では、血液は右心室から肺動脈を経て肺の毛細血管に入り、肺静脈を通って左心房に戻る。","体循環では、血液は左心室から大動脈に入り、全身の毛細血管を経て静脈血となり、大静脈を通って右心房に戻る。","心臓は、洞結節（洞房結節）で発生した刺激が、刺激伝導系を介して心筋に伝わることにより、規則正しく収縮と拡張を繰り返す。","肺動脈を流れる血液は動脈血であり、肺静脈を流れる血液は静脈血である。","心臓自体は、冠動脈によって酸素や栄養素の供給を受けている。"],"answer":4,"exp":"肺動脈には二酸化炭素を多く含む静脈血、肺静脈には酸素を多く含む動脈血が流れる。","notes":["正しい。","正しい。","正しい。","誤り（正答）。逆。","正しい。"],"ref":"労働生理テキスト"},{"id":"A37","set":"A","no":37,"cat":"phys","topic":"呼吸","freq":3,"q":"呼吸に関する次の記述のうち、正しいものはどれか。","choices":["成人の安静時の呼吸数は、通常、1分間に約60回である。","呼吸中枢は延髄にあり、主に動脈血中の二酸化炭素分圧の上昇により刺激されて、呼吸が促進される。","呼吸運動は、気管と胸膜の協調運動によって、胸郭内容積を周期的に増減させて行われる。","通常の呼吸の場合の呼気には、酸素が約21％含まれる。","肺胞内の空気と肺胞を取り巻く毛細血管中の血液との間で行われるガス交換を、内呼吸という。"],"answer":2,"exp":"呼吸運動は主に横隔膜と肋間筋によって行われる。肺でのガス交換は外呼吸、組織細胞と血液の間は内呼吸。呼気中の酸素は約16％、二酸化炭素は約4％。","notes":["誤り。成人の安静時はおおむね1分間に16～20回程度。","正しい（正答）。","誤り。主に横隔膜・肋間筋による。","誤り。約16％。","誤り。外呼吸。"],"ref":"労働生理テキスト"},{"id":"A38","set":"A","no":38,"cat":"phys","topic":"腎臓・尿","freq":3,"q":"腎臓又は尿に関する次の記述のうち、誤っているものはどれか。","choices":["腎機能が正常な場合、血液中の糖はボウマン嚢に濾し出されない。","尿細管では、原尿に含まれる大部分の水分、電解質、糖などの栄養物質が血液中に再吸収される。","尿の約95％は水分で、約5％が固形物である。","糸球体では、血液中の血球及び蛋白質以外の成分がボウマン嚢に濾し出され、原尿が生成される。","血液中の尿素窒素（BUN）の値が高くなる場合は、腎臓の機能の低下が考えられる。"],"answer":1,"exp":"糖（グルコース）はいったん原尿中に濾し出されるが、正常であれば尿細管でほぼ全て再吸収されるため尿中には出てこない。","notes":["誤り（正答）。糖は濾し出された後に再吸収される。","正しい。","正しい。","正しい。","正しい。"],"ref":"労働生理テキスト"},{"id":"A39","set":"A","no":39,"cat":"phys","topic":"筋肉","freq":2,"q":"筋肉に関する次の記述のうち、誤っているものはどれか。","choices":["心筋は横紋筋であるが、自分の意思で動かすことのできない不随意筋である。","強い力を必要とする運動を続けていると、筋肉を構成する個々の筋線維が太くなり筋力が増強する。","横紋筋は骨格筋と心筋から成り、平滑筋は主に内臓や血管の壁にある。","長時間の姿勢保持を伴う作業では、持続的な静的筋収縮（等尺性収縮）が生じる。","筋肉中のグリコーゲンは、酸素が十分に供給されると完全に分解され、最後に乳酸になる。"],"answer":5,"exp":"グリコーゲンは、酸素が十分にあると完全に分解されて二酸化炭素と水になり、酸素が不足すると分解が不完全で乳酸が生じる。","notes":["正しい。","正しい。筋線維の数ではなく太さが増す。","正しい。","正しい。","誤り（正答）。乳酸になるのは酸素不足時。"],"ref":"労働生理テキスト"},{"id":"A40","set":"A","no":40,"cat":"phys","topic":"視覚","freq":3,"q":"視覚に関する次の記述のうち、誤っているものはどれか。","choices":["明るい所から急に暗い所に入ると、初めは見えにくいが、暗順応によって徐々に見えるようになる。","網膜の錐状体は明るい所で色を感じ、杆状体は暗い所で弱い光や明暗を感じる。","眼軸が短すぎることなどにより、平行光線が網膜の後方で像を結ぶものを遠視という。","眼は、毛様体筋の働きで水晶体の厚さを変えることにより焦点距離を調節している。","遠見視力の検査は、一般に、10mの距離で実施する。"],"answer":5,"exp":"遠見視力の検査は一般に5mの距離で行う。近視は眼軸が長すぎて網膜の前方で像を結ぶ状態。","notes":["正しい。","正しい。","正しい。","正しい。硝子体ではなく水晶体。","誤り（正答）。5m。"],"ref":"労働生理テキスト"},{"id":"A41","set":"A","no":41,"cat":"phys","topic":"消化と吸収","freq":3,"q":"栄養素の消化及び吸収に関する次の記述のうち、誤っているものはどれか。","choices":["ブドウ糖とアミノ酸は、小腸の絨毛からリンパ管に吸収され、肝臓を経由せずに全身に運ばれる。","胆汁は、消化酵素を含まないが、脂肪を乳化させて脂肪の分解を助ける。","脂肪は、リパーゼにより脂肪酸とグリセリンに分解され、小腸の絨毛から吸収される。","炭水化物（糖質）は、アミラーゼなどの消化酵素によりブドウ糖などに分解されて吸収される。","蛋白質は、ペプシン、トリプシンなどの消化酵素によりアミノ酸に分解されて吸収される。"],"answer":1,"exp":"ブドウ糖とアミノ酸は絨毛の毛細血管に吸収され、門脈を通って肝臓に運ばれる。脂肪酸とグリセリンは絨毛から吸収された後、主にリンパ管に入る。","notes":["誤り（正答）。毛細血管→門脈→肝臓。","正しい。胆汁はアルカリ性。","正しい。","正しい。","正しい。"],"ref":"労働生理テキスト"},{"id":"A42","set":"A","no":42,"cat":"phys","topic":"血液","freq":3,"q":"血液に関する次の記述のうち、正しいものはどれか。","choices":["血液の凝固は、血漿中のフィブリンがフィブリノーゲンに変化し、赤血球などが絡みついて固まる現象である。","血漿中の蛋白質のうち、グロブリンは血液浸透圧の維持に関与し、アルブミンは免疫物質の抗体を含む。","赤血球の寿命は、約10日である。","白血球のうちリンパ球は、白血球全体の約60％を占め、細菌などの異物を貪食する。","ヘマトクリットは、血液の容積に対する赤血球の相対的容積をいう。"],"answer":5,"exp":"ヘマトクリット値は貧血の指標の一つで、男性の方が女性より高い傾向がある。","notes":["誤り。フィブリノーゲン（可溶性）がフィブリン（不溶性）に変化する。","誤り。アルブミンが浸透圧の維持、グロブリンが抗体（免疫グロブリン）。","誤り。約120日。","誤り。リンパ球は約30％で免疫反応に関与。約60％を占め貪食するのは好中球。","正しい（正答）。"],"ref":"労働生理テキスト"},{"id":"A43","set":"A","no":43,"cat":"phys","topic":"内分泌（ホルモン）","freq":3,"q":"ホルモン、その内分泌器官及びそのはたらきの組合せとして、誤っているものは次のうちどれか。","choices":["インスリン ……… 膵臓 ……… 血糖量の増加","パラソルモン ……… 副甲状腺 ……… 体液中のカルシウムバランスの調節","メラトニン ……… 松果体 ……… 睡眠と覚醒のリズムの調節","コルチゾール ……… 副腎皮質 ……… 血糖量の増加","アルドステロン ……… 副腎皮質 ……… 体液中の塩類バランスの調節"],"answer":1,"exp":"インスリンは血糖量を減少させる唯一のホルモン。血糖量を増加させるのはグルカゴン（膵臓）、アドレナリン（副腎髄質）、コルチゾール（副腎皮質）など。","notes":["誤り（正答）。インスリンは血糖量を減少させる。","正しい。","正しい。","正しい。","正しい。"],"ref":"労働生理テキスト"},{"id":"A44","set":"A","no":44,"cat":"phys","topic":"睡眠・代謝","freq":3,"q":"睡眠などに関する次の記述のうち、誤っているものはどれか。","choices":["基礎代謝量は、生命維持に必要な最小限のエネルギー量で、睡眠中の測定値で表される。","睡眠は、眼球が速く動くレム睡眠と、そうでないノンレム睡眠に分類され、安らかな眠りはノンレム睡眠である。","睡眠と覚醒のリズムのように、約1日の周期で繰り返される生物学的リズムをサーカディアンリズムといい、このリズムの乱れは疲労や睡眠障害の原因となる。","夜間に分泌が上昇するホルモンであるメラトニンは、睡眠と覚醒のリズムの調節に関与している。","夕食時の多量の飲食は、消化活動が睡眠を妨げる原因となることがある。"],"answer":1,"exp":"基礎代謝量は、覚醒・横臥・安静時の測定値で表される。睡眠中のエネルギー代謝量は基礎代謝量よりも低い。","notes":["誤り（正答）。覚醒・横臥・安静時。","正しい。","正しい。","正しい。","正しい。"],"ref":"労働生理テキスト"},{"id":"B01","set":"B","no":1,"cat":"law_h","topic":"衛生管理体制（選任）","freq":3,"q":"常時600人の労働者を使用する化学工業の事業場における衛生管理体制に関する(1)～(5)の記述のうち、法令上、誤っているものはどれか。\nただし、600人中には、屋内作業場において次の業務に常時従事する者が含まれているが、その他の有害業務はないものとし、衛生管理者及び産業医の選任の特例はないものとする。\n・塩酸を取り扱う業務　40人\n・深夜業を含む業務　100人","choices":["衛生管理者は、3人以上選任しなければならない。","衛生管理者のうち1人を、衛生工学衛生管理者免許を受けた者のうちから選任しなければならない。","衛生管理者のうち少なくとも1人を専任の衛生管理者としなければならない。","産業医は、この事業場に専属の者を選任しなければならない。","総括安全衛生管理者を選任しなければならない。"],"answer":4,"exp":"専属産業医が必要なのは、常時1,000人以上の事業場、又は一定の有害業務（深夜業を含む業務等）に常時500人以上従事させる事業場。本問は600人で、有害業務従事者も500人未満のため、専属でない産業医でよい。","notes":["正しい。501～1,000人は3人以上。","正しい。500人超かつ労基則18条9号の業務（塩酸等の有害物）に30人以上のため必要。","正しい。500人超かつ労基則18条の業務に30人以上のため必要。","誤り（正答）。専属である必要はない。","正しい。化学工業（製造業）は300人以上で選任。"],"ref":"安衛令2条、安衛則7条・13条、労基則18条"},{"id":"B02","set":"B","no":2,"cat":"law_h","topic":"作業主任者の資格","freq":3,"q":"次の作業主任者とその選任資格との組合せとして、法令上、誤っているものはどれか。","choices":["特別有機溶剤業務に係る特定化学物質作業主任者 ……… 有機溶剤作業主任者技能講習を修了した者","有機溶剤作業主任者 ……… 有機溶剤作業主任者技能講習を修了した者","第二種酸素欠乏危険作業に係る酸素欠乏危険作業主任者 ……… 酸素欠乏危険作業主任者技能講習を修了した者","鉛作業主任者 ……… 鉛作業主任者技能講習を修了した者","エックス線作業主任者 ……… エックス線作業主任者免許を受けた者"],"answer":3,"exp":"第二種酸素欠乏危険作業（硫化水素中毒のおそれもある作業）の作業主任者は、酸素欠乏・硫化水素危険作業主任者技能講習の修了者から選任する。第一種はどちらの技能講習でもよい。","notes":["正しい。特化則27条2項。","正しい。","誤り（正答）。","正しい。","正しい。"],"ref":"安衛則16条・別表第1、酸欠則11条、特化則27条"},{"id":"B03","set":"B","no":3,"cat":"law_h","topic":"定期自主検査","freq":3,"q":"次の設備のうち、法令に基づく定期自主検査の実施頻度が1年以内ごとに1回とされていないものはどれか。","choices":["有機溶剤を用いて塗装を行う屋内の作業場所に設置した局所排気装置","鉛化合物を製造する工程において鉛等の溶融を行う屋内の作業場所に設置した局所排気装置","特定粉じん発生源に設置した局所排気装置に設けた除じん装置","第二類物質を取り扱う屋内の作業場所に設置したプッシュプル型換気装置","硫酸を取り扱う特定化学設備及びその附属設備"],"answer":5,"exp":"特定化学設備及びその附属設備の定期自主検査は2年以内ごとに1回。局所排気装置・プッシュプル型換気装置・除じん装置・排ガス処理装置・排液処理装置は原則1年以内ごとに1回。","notes":["1年以内ごと（有機則20条）。","1年以内ごと（鉛則35条）。","1年以内ごと（粉じん則17条）。","1年以内ごと（特化則30条）。","2年以内ごと（正答）（特化則31条）。"],"ref":"安衛令15条、各特別規則"},{"id":"B04","set":"B","no":4,"cat":"law_h","topic":"特殊健康診断の対象業務","freq":3,"q":"次の業務に常時従事する労働者に対し、法令に基づく医師による特別の項目についての健康診断を行う必要がないものはどれか。","choices":["鉛ライニングの業務","強烈な騒音を発する場所における業務","圧気工法により、大気圧を超える気圧下の作業室の内部において行う作業に係る業務","石綿等を取り扱う業務","屋内作業場のタンクの内部において第三種有機溶剤等を用いて行う洗浄の業務"],"answer":2,"exp":"騒音作業の健康診断（騒音健康診断）は「騒音障害防止のためのガイドライン」に基づく行政指導であり、法令上の特殊健康診断ではない。","notes":["必要（鉛健康診断）。","不要（正答）。ガイドラインに基づく指導勧奨。","必要（高気圧業務健康診断）。","必要（石綿健康診断）。","必要。第三種有機溶剤はタンク等の内部の業務に限り対象。"],"ref":"安衛法66条2項、安衛令22条"},{"id":"B05","set":"B","no":5,"cat":"law_h","topic":"所轄労基署長への報告","freq":3,"q":"事業者が、法令に基づく次の措置を行ったとき、その結果について所轄労働基準監督署長に報告することが義務付けられていないものはどれか。","choices":["定期の高気圧業務健康診断","常時60人の労働者を使用する事業場における心理的な負担の程度を把握するための検査（ストレスチェック）","定期の電離放射線健康診断","常時40人の労働者を使用する事業場における定期の有機溶剤等健康診断","雇入れの際の鉛健康診断"],"answer":5,"exp":"特殊健康診断の結果報告は「定期のもの」が対象で、常時使用労働者数にかかわらず報告が必要。雇入れ時・配置替え時の特殊健康診断は報告不要。","notes":["報告義務あり（高圧則40条）。","報告義務あり（安衛則52条の21、常時50人以上の事業場）。","報告義務あり（電離則58条）。","報告義務あり（有機則30条の3）。","報告義務なし（正答）。"],"ref":"有機則30条の3、鉛則55条、電離則58条、高圧則（健康診断結果報告）、安衛則52条の21"},{"id":"B06","set":"B","no":6,"cat":"law_h","topic":"粉じん障害防止規則","freq":2,"q":"粉じん障害防止規則に関する次の記述のうち、法令上、誤っているものはどれか。\nただし、同規則に定める適用除外及び特例はないものとする。","choices":["特定粉じん発生源には、発散源を密閉する設備、局所排気装置、プッシュプル型換気装置の設置又は湿潤な状態に保つための設備の設置等の措置を講じなければならない。","粉じん作業を行う屋内の作業場所については、毎日1回以上、清掃を行わなければならない。","屋内作業場における空気中の粉じんの濃度の測定の記録は、3年間保存しなければならない。","常時特定粉じん作業を行う屋内作業場については、6か月以内ごとに1回、定期に、空気中の粉じんの濃度を測定しなければならない。","常時特定粉じん作業を行う屋内作業場の空気中の粉じんの濃度の測定は、作業環境測定士に実施させなければならない。"],"answer":3,"exp":"粉じん濃度の測定記録の保存期間は7年間（じん肺健康診断の記録も7年間）。","notes":["正しい。粉じん則4条。","正しい。粉じん則24条（ほか1か月以内ごとに1回、真空掃除機又は水洗等による清掃）。","誤り（正答）。7年間。","正しい。粉じん則26条。","正しい。指定作業場の測定（作業環境測定法）。"],"ref":"粉じん則4条・24条・26条"},{"id":"B07","set":"B","no":7,"cat":"law_h","topic":"電離放射線障害防止規則","freq":3,"q":"電離放射線障害防止規則に基づく放射線業務従事者の被ばく限度等に関する次の記述のうち、誤っているものはどれか。","choices":["放射線業務従事者が受ける実効線量の限度は、5年間につき100mSv、かつ、1年間につき50mSvである。","管理区域とは、外部放射線による実効線量と空気中の放射性物質による実効線量との合計が3か月間につき1.3mSvを超えるおそれのある区域等をいう。","妊娠と診断された女性の放射線業務従事者が受ける腹部表面に受ける等価線量の限度は、妊娠と診断されたときから出産までの間につき2mSvである。","放射線業務従事者が眼の水晶体に受ける等価線量の限度は、5年間につき100mSv、かつ、1年間につき50mSvである。","放射線業務従事者が皮膚に受ける等価線量の限度は、1年間につき150mSvである。"],"answer":5,"exp":"皮膚の等価線量限度は1年間につき500mSv。眼の水晶体は令和3年4月改正で5年100mSv・1年50mSvに引き下げられた。","notes":["正しい。電離則4条。","正しい。電離則3条。","正しい。電離則6条。","正しい。電離則5条。","誤り（正答）。500mSv。"],"ref":"電離則3条～6条"},{"id":"B08","set":"B","no":8,"cat":"law_h","topic":"特別管理物質","freq":2,"q":"特定化学物質障害予防規則に規定する特別管理物質に関する次の記述のうち、法令上、誤っているものはどれか。","choices":["特別管理物質を取り扱う屋内作業場について行った作業環境測定の記録及びその評価の記録は、30年間保存しなければならない。","特別管理物質は、特定化学物質の第三類物質のうち、がん等の遅発性の健康障害を生じるおそれのある物質として定められている。","特別管理物質を取り扱う業務に常時従事する労働者に係る特定化学物質健康診断個人票は、30年間保存しなければならない。","特別管理物質を取り扱う作業場には、特別管理物質の名称、人体に及ぼす作用、取扱い上の注意事項及び使用すべき保護具を掲示しなければならない。","特別管理物質を取り扱う業務に常時従事する労働者について、1か月を超えない期間ごとに、労働者の氏名、従事した作業の概要及び期間等を記録し、30年間保存しなければならない。"],"answer":2,"exp":"特別管理物質は、第一類物質及び第二類物質のうち、がん原性等により遅発性の健康障害を生じるおそれのある物質として定められている。第三類物質は大量漏えいによる急性中毒の防止を目的とする物質。","notes":["正しい。特化則36条。","誤り（正答）。第一類・第二類物質の中から指定。","正しい。特化則40条。","正しい。特化則38条の3。","正しい。特化則38条の4。"],"ref":"特化則2条・36条・38条の3・38条の4・40条"},{"id":"B09","set":"B","no":9,"cat":"law_h","topic":"時間外労働の制限業務（1日2時間）","freq":3,"q":"労働基準法に基づく時間外労働に関する協定を締結し、これを所轄労働基準監督署長に届け出る場合においても、労働時間の延長が1日2時間を超えてはならない業務に該当しないものは、次のうちどれか。","choices":["多量の低温物体を取り扱う業務","病原体によって汚染のおそれが著しい業務","削岩機、鋲打機等の使用によって身体に著しい振動を与える業務","鉛の粉じんを発散する場所における業務","異常気圧下における業務"],"answer":2,"exp":"1日2時間の延長制限がある業務（労基則18条）：多量の高熱物体・暑熱、多量の低温物体・寒冷、有害放射線、土石等のじんあい、異常気圧、著しい振動、重量物、強烈な騒音、鉛・水銀等の有害物の粉じん等を発散する場所など。病原体による汚染、著しく湿潤な場所は含まれない。","notes":["該当する。","該当しない（正答）。","該当する。","該当する。","該当する。"],"ref":"労基法36条6項1号、労基則18条"},{"id":"B10","set":"B","no":10,"cat":"law_h","topic":"石綿障害予防規則","freq":2,"q":"石綿障害予防規則に関する次の記述のうち、法令上、誤っているものはどれか。","choices":["石綿健康診断個人票は、当該労働者が当該事業場において常時当該業務に従事しないこととなった日から40年間保存しなければならない。","石綿等の取扱いに伴い石綿の粉じんを発散する場所における業務に常時従事する労働者の作業の記録は、5年間保存しなければならない。","石綿等を取り扱う作業については、石綿作業主任者技能講習を修了した者のうちから石綿作業主任者を選任しなければならない。","石綿等を取り扱う屋内作業場については、6か月以内ごとに1回、定期に、空気中の石綿の濃度を測定しなければならない。","石綿等を取り扱う屋内作業場の空気中の石綿の濃度の測定の記録は、40年間保存しなければならない。"],"answer":2,"exp":"石綿の作業の記録は、当該労働者が当該事業場で常時当該作業に従事しないこととなった日から40年間保存。石綿関係の記録は原則40年。","notes":["正しい。石綿則40条。","誤り（正答）。40年間（石綿則35条）。","正しい。石綿則19条。","正しい。石綿則36条。","正しい。石綿則36条2項。"],"ref":"石綿則19条・35条・36条・40条"},{"id":"B11","set":"B","no":11,"cat":"hyg_h","topic":"有害物質の存在様式","freq":2,"q":"空気中の有害物質の状態に関する次の記述のうち、正しいものはどれか。","choices":["ミストは、固体の微細な粒子が空気中に浮遊しているものである。","蒸気とは、常温・常圧で気体の物質が空気中に拡散しているものをいう。","ヒュームは、気体が冷却されて液化した微細な粒子である。","ヒュームは、金属などが加熱されて蒸気となり、空気中で凝固した固体の微粒子で、一般に粉じんより粒径が小さい。","塩化ビニルは、常温・常圧の空気中では蒸気として存在する。"],"answer":4,"exp":"粉じん：固体が破砕されて生じた微粒子。ヒューム：金属等の蒸気が凝固した固体微粒子（溶接ヒューム等）。ミスト：液体の微細な粒子。蒸気：常温・常圧で液体又は固体の物質が揮発・昇華したもの。ガス：常温・常圧で気体のもの。","notes":["誤り。ミストは液体の微粒子。","誤り。それはガスの定義。","誤り。ヒュームは固体の微粒子。","正しい（正答）。","誤り。塩化ビニルは常温・常圧で気体（ガス）。"],"ref":"労働衛生（有害業務）テキスト"},{"id":"B12","set":"B","no":12,"cat":"hyg_h","topic":"化学物質リスクアセスメント","freq":3,"q":"化学物質のリスクアセスメントに関する次の記述のうち、誤っているものはどれか。","choices":["リスクの見積りは、化学物質等により労働者に生ずるおそれのある疾病の発生の可能性及び重篤度を考慮する方法や、ばく露の程度と濃度基準値等とを比較する方法などにより行う。","リスクアセスメントは、名称等の表示義務等の有無にかかわらず、全ての化学物質について実施することが法令で義務付けられている。","リスクアセスメントの結果は、対象業務に従事する労働者に周知しなければならない。","リスクアセスメント対象物を原材料等として新規に採用し、又は変更するときは、リスクアセスメントを行わなければならない。","化学物質の危険性又は有害性（ハザード）と、それによって生ずるおそれのある負傷又は疾病の発生の可能性及び重篤度の組合せ（リスク）は、異なる概念である。"],"answer":2,"exp":"リスクアセスメントの実施義務があるのは「リスクアセスメント対象物」（ラベル表示・SDS交付義務の対象物質）。それ以外の危険有害な化学物質については努力義務。","notes":["正しい。","誤り（正答）。義務はリスクアセスメント対象物に限られる。","正しい。","正しい。安衛則34条の2の7。","正しい。ハザードは危険性又は有害性そのもの、リスクは発生の可能性と重篤度の組合せ。"],"ref":"安衛法57条の3、安衛則34条の2の7・34条の2の8"},{"id":"B13","set":"B","no":13,"cat":"hyg_h","topic":"有機溶剤の特性と障害","freq":3,"q":"有機溶剤に関する次の記述のうち、正しいものはどれか。","choices":["メタノールによる健康障害として顕著なものは、末梢神経障害である。","ノルマルヘキサンによる健康障害として顕著なものは、視力低下を伴う視神経障害である。","有機溶剤は、一般に揮発性及び脂溶性が高く、その蒸気は空気より重い。","有機溶剤は、呼吸器から吸収されるが、皮膚から吸収されることはない。","酢酸メチルによる健康障害では、再生不良性貧血などの造血器障害がみられる。"],"answer":3,"exp":"有機溶剤は脂溶性が高く、脂肪の多い脳などに入りやすい。メタノール・酢酸メチル→視神経障害、ノルマルヘキサン→末梢神経障害、二硫化炭素→精神障害・網膜細動脈瘤を伴う脳血管障害、N,N-ジメチルホルムアミド→頭痛・肝機能障害、ベンゼン→造血器障害。","notes":["誤り。視神経障害（視力低下）。","誤り。末梢神経障害。","正しい（正答）。","誤り。皮膚からも吸収される。","誤り。視神経障害。"],"ref":"労働衛生（有害業務）テキスト"},{"id":"B14","set":"B","no":14,"cat":"hyg_h","topic":"騒音","freq":3,"q":"騒音及び騒音障害に関する次の記述のうち、誤っているものはどれか。","choices":["騒音性難聴は、騒音へのばく露を中止すれば、通常、聴力は元に戻る。","等価騒音レベルは、時間的に変動する騒音について、測定時間内の平均的な騒音の程度を表す指標である。","騒音は、自律神経系や内分泌系にも影響を与え、交感神経の活動の亢進などがみられることがある。","騒音性難聴の初期には、4,000Hz付近を中心とする聴力低下（c5dip）がみられる。","騒音性難聴は、内耳にある有毛細胞の変性によって起こる感音性難聴である。"],"answer":1,"exp":"騒音性難聴は不可逆的で、いったん生じると回復しにくい。そのため発生源対策・伝ぱ経路対策を優先し、聴覚保護具の使用など早期の予防が重要。","notes":["誤り（正答）。治りにくい。","正しい。","正しい。","正しい。","正しい。"],"ref":"騒音障害防止のためのガイドライン"},{"id":"B15","set":"B","no":15,"cat":"hyg_h","topic":"電離放射線・有害光線","freq":3,"q":"電離放射線及び有害光線に関する次の記述のうち、誤っているものはどれか。","choices":["赤外線は、白内障や皮膚の熱傷の原因となることがある。","紫外線は、電光性眼炎や皮膚がんの原因となることがある。","エックス線は電磁波であり、アルファ線やベータ線は粒子線である。","電離放射線の確定的影響は、しきい値が存在せず、被ばく線量の増加に応じて発生率が増加する。","電離放射線の確率的影響には、がんや遺伝的影響があり、発生にしきい値はないと考えられている。"],"answer":4,"exp":"確定的影響（白内障、脱毛、不妊など）はしきい値があり、しきい値を超えると線量の増加に応じて重症度が増す。確率的影響（がん、遺伝的影響）はしきい値がなく、線量の増加に応じて発生率が増加する。","notes":["正しい。","正しい。","正しい。","誤り（正答）。記述は確率的影響の特徴。","正しい。"],"ref":"労働衛生（有害業務）テキスト"},{"id":"B16","set":"B","no":16,"cat":"hyg_h","topic":"温熱・寒冷による健康障害","freq":3,"q":"温熱環境・寒冷環境による健康障害に関する次の記述のうち、誤っているものはどれか。","choices":["凍傷は0℃以下の寒冷による組織の凍結壊死であり、凍瘡は日常生活での0℃以上の軽度の寒冷によって生じるしもやけである。","熱けいれんは、多量の発汗により失われた塩分を補給せず水分のみを補給した場合に、筋肉のけいれんを起こすものである。","低体温症は、全身が冷やされて体の中心部の温度が35℃程度以下に低下した状態をいう。","熱失神（熱虚脱）は、高温環境下で皮膚の血管が拡張し、脳への血流が減少することにより、めまいや失神を起こすものである。","金属熱は、金属の溶融作業において、高温環境により体温調節中枢が麻痺することにより発生する。"],"answer":5,"exp":"金属熱は、亜鉛や銅などの金属ヒュームを吸入した後に、悪寒・発熱・関節痛などがみられるもので、高温環境による体温調節障害ではない。","notes":["正しい。","正しい。","正しい。","正しい。","誤り（正答）。金属ヒュームの吸入による。"],"ref":"労働衛生（有害業務）テキスト"},{"id":"B17","set":"B","no":17,"cat":"hyg_h","topic":"管理区分と措置","freq":2,"q":"作業環境測定結果の評価に基づく管理区分とその状態又は講ずべき措置に関する次の記述のうち、誤っているものはどれか。","choices":["第三管理区分に区分された場所については、直ちに施設、設備、作業工程又は作業方法の点検を行い、改善措置を講じ、その効果を確認するため測定・評価を行わなければならない。","第二管理区分に区分された場所については、直ちに作業を中止し、労働者に有効な呼吸用保護具を使用させなければならない。","第二管理区分は、当該単位作業場所の気中有害物質の濃度の平均が管理濃度を超えない状態である。","第一管理区分は、当該単位作業場所のほとんど（95％以上）の場所で気中有害物質の濃度が管理濃度を超えない状態である。","第三管理区分は、当該単位作業場所の気中有害物質の濃度の平均が管理濃度を超える状態である。"],"answer":2,"exp":"第二管理区分では、施設・設備・作業工程・作業方法の点検を行い、必要な改善措置を講ずるよう努める（努力義務）。作業中止は求められていない。第一管理区分は現在の管理の継続的維持に努める。","notes":["正しい。","誤り（正答）。","正しい（ただし管理濃度を超える場所がある）。","正しい。","正しい。"],"ref":"作業環境評価基準、有機則28条の2～28条の4ほか"},{"id":"B18","set":"B","no":18,"cat":"hyg_h","topic":"局所排気装置（フード分類）","freq":3,"q":"局所排気装置に関する次の記述のうち、誤っているものはどれか。","choices":["スロット型フードやルーバ型フードは、外付け式フードに分類される。","フード開口部の周囲にフランジを付けると、フランジがないときに比べ、少ない排風量で所要の効果を上げることができる。","キャノピ型フードは、レシーバ式フードに分類される。","ドラフトチェンバ型フードや建築ブース型フードは、囲い式フードに分類される。","ダクトの断面積を小さくするほど、ダクトの圧力損失は減少する。"],"answer":5,"exp":"ダクトの断面積を小さくすると風速が上がり圧力損失は増大する。一方、断面積を大きくしすぎると搬送速度が不足し、粉じん等が堆積しやすくなる。","notes":["正しい。","正しい。","正しい。グラインダー型もレシーバ式。","正しい。","誤り（正答）。圧力損失は増大する。"],"ref":"労働衛生工学（局所排気装置）"},{"id":"B19","set":"B","no":19,"cat":"hyg_h","topic":"特殊健康診断","freq":3,"q":"特殊健康診断に関する次の記述のうち、誤っているものはどれか。","choices":["特殊健康診断の結果は、作業環境管理及び作業管理を見直す際の資料としても活用できる。","電離放射線健康診断の項目には、白内障に関する眼の検査は含まれていない。","体内に取り込まれた多くの有機溶剤は生物学的半減期が短いので、有機溶剤等健康診断における尿中の代謝物の量の検査のための採尿の時刻は、厳重にチェックする必要がある。","振動工具取扱い作業者に対する特殊健康診断を1年に2回実施する場合、そのうち1回は冬季に行うとよい。","有害業務への配置替えの際に行う特殊健康診断には、業務適性の判断と、その後の業務の影響を調べるための基礎資料を得るという目的がある。"],"answer":2,"exp":"電離放射線健康診断の項目：被ばく歴の有無の調査・評価、白血球数及び白血球百分率、赤血球数及び血色素量又はヘマトクリット値、白内障に関する眼の検査、皮膚の検査。","notes":["正しい。","誤り（正答）。白内障に関する眼の検査は含まれる。","正しい。","正しい。症状が出やすい冬季に実施するとよい。","正しい。"],"ref":"電離則56条ほか"},{"id":"B20","set":"B","no":20,"cat":"hyg_h","topic":"労働衛生保護具","freq":3,"q":"労働衛生保護具に関する次の記述のうち、誤っているものはどれか。","choices":["隔離式防毒マスクは、直結式防毒マスクよりも低い濃度の有害ガスに対して使用するものである。","耳栓と耳覆い（イヤーマフ）のどちらを選ぶかは作業の性質や騒音の性状で決まるが、非常に強烈な騒音に対しては両者を併用することも有効である。","遮光保護具には、遮光度番号が定められており、溶接作業などの作業の種類に応じて適切な遮光度番号のものを使用する。","化学防護手袋は、対象物質に対する透過性や劣化を考慮して選択し、使用可能時間を超えて使用しないようにする。","保護めがねは、飛散する粒子や薬品の飛沫などによる眼の障害を防止するために使用する。"],"answer":1,"exp":"吸収缶の容量が大きい隔離式防毒マスクは、直結式・直結式小型よりも高い濃度の有害ガスに対して使用できる。","notes":["誤り（正答）。隔離式の方が高濃度に対応。","正しい。","正しい。遮光度番号が大きいほど遮光能力が高い。","正しい。","正しい。"],"ref":"防毒マスクの選択、使用等について（通達）"},{"id":"B21","set":"B","no":21,"cat":"law_g","topic":"産業医","freq":3,"q":"産業医に関する次の記述のうち、法令上、誤っているものはどれか。\nただし、産業医の選任の特例はないものとする。","choices":["事業者は、産業医から労働者の健康管理等について勧告を受けたときは、当該勧告の内容及び当該勧告を踏まえて講じた措置の内容（措置を講じない場合はその旨及びその理由）を記録し、3年間保存しなければならない。","事業者が法人の場合、当該法人の代表者は、医師であっても、当該事業場の産業医として選任することはできない。","常時使用する労働者数が2,000人を超える事業場では、産業医を2人以上選任しなければならない。","産業医は、少なくとも毎月1回作業場等を巡視しなければならないが、事業者から毎月1回以上所定の情報の提供を受けている場合であって事業者の同意を得ているときは、少なくとも2か月に1回とすることができる。","産業医は、選任すべき事由が発生した日から14日以内に選任しなければならない。"],"answer":3,"exp":"産業医を2人以上選任しなければならないのは、常時3,000人を超える労働者を使用する事業場。","notes":["正しい。安衛則14条の3。","正しい。安衛則13条1項2号。","誤り（正答）。3,000人を超える場合。","正しい。安衛則15条。","正しい。安衛則13条。"],"ref":"安衛則13条・14条の3・15条"},{"id":"B22","set":"B","no":22,"cat":"law_g","topic":"総括安全衛生管理者","freq":2,"q":"総括安全衛生管理者に関する次の記述のうち、法令上、誤っているものはどれか。","choices":["都道府県労働局長は、労働災害を防止するため必要があると認めるときは、総括安全衛生管理者の業務の執行について事業者に勧告することができる。","総括安全衛生管理者は、選任すべき事由が発生した日から14日以内に選任し、遅滞なく、選任報告書を所轄労働基準監督署長に提出しなければならない。","総括安全衛生管理者が旅行、疾病、事故その他やむを得ない事由によって職務を行うことができないときは、代理者を選任しなければならない。","常時使用する労働者数が300人の医療業の事業場では、総括安全衛生管理者を選任しなければならない。","総括安全衛生管理者は、当該事業場においてその事業の実施を統括管理する者をもって充てなければならない。"],"answer":4,"exp":"総括安全衛生管理者の選任基準：林業・鉱業・建設業・運送業・清掃業は常時100人以上、製造業・電気業・ガス業・熱供給業・水道業・通信業・各種商品卸売/小売業・家具建具じゅう器等卸売/小売業・燃料小売業・旅館業・ゴルフ場業・自動車整備業・機械修理業は常時300人以上、その他の業種（医療業、金融業など）は常時1,000人以上。","notes":["正しい。安衛法10条3項。","正しい。安衛則2条。","正しい。安衛則3条。","誤り（正答）。医療業は1,000人以上で選任。","正しい。安衛法10条2項。"],"ref":"安衛法10条、安衛令2条、安衛則2条・3条"},{"id":"B23","set":"B","no":23,"cat":"law_g","topic":"定期健康診断の省略項目","freq":3,"q":"労働安全衛生規則に基づく次の定期健康診断項目のうち、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、省略することができる項目に該当しないものはどれか。","choices":["尿中の糖及び蛋白の有無の検査","肝機能検査","心電図検査","身長の検査","腹囲の検査"],"answer":1,"exp":"省略可能な項目：身長（20歳以上）、腹囲（40歳未満で35歳以外の者等）、胸部エックス線検査・喀痰検査、貧血検査、肝機能検査、血中脂質検査、血糖検査、心電図検査（40歳未満で35歳以外の者）。既往歴・業務歴、自覚症状・他覚症状、体重、視力、聴力、血圧、尿検査は省略できない（聴力は一定年齢で医師が適当と認める方法に代替可）。","notes":["省略不可（正答）。","省略可。","省略可。","省略可。","省略可。"],"ref":"安衛則44条2項、平成10年労働省告示第88号"},{"id":"B24","set":"B","no":24,"cat":"law_g","topic":"ストレスチェック","freq":3,"q":"労働安全衛生法に基づく心理的な負担の程度を把握するための検査（ストレスチェック）及びその結果に基づく面接指導に関する次の記述のうち、法令上、誤っているものはどれか。","choices":["ストレスチェックを実施する者は、医師、保健師又は所定の研修を修了した歯科医師、看護師、精神保健福祉士若しくは公認心理師でなければならない。","ストレスチェックの検査項目は、職場における当該労働者の心理的な負担の原因、心理的な負担による心身の自覚症状及び職場における他の労働者による当該労働者への支援に関する項目である。","事業者は、面接指導の結果に基づき、当該面接指導の結果の記録を作成して、これを3年間保存しなければならない。","常時50人以上の労働者を使用する事業場においては、1年以内ごとに1回、定期に、ストレスチェックを行わなければならない。","事業者は、ストレスチェックの結果を、労働者の同意を得ないで、実施者から提供を受けてはならない。"],"answer":3,"exp":"ストレスチェックに基づく面接指導の記録は5年間保存。なお、常時50人未満の事業場への実施義務の拡大は令和10年4月1日施行予定（現時点では努力義務）。","notes":["正しい。安衛則52条の10。","正しい。安衛則52条の9。","誤り（正答）。5年間（安衛則52条の18）。","正しい。安衛則52条の9。","正しい。安衛法66条の10第2項。"],"ref":"安衛法66条の10、安衛則52条の9～52条の21"},{"id":"B25","set":"B","no":25,"cat":"law_g","topic":"事業場の衛生基準（安衛則）","freq":3,"q":"事業場の建築物、施設等に関する措置について、労働安全衛生規則の衛生基準に違反しているものは次のうちどれか。","choices":["事業場に附属する食堂の床面積を、食事の際の1人について、1.1m²としている。","男性35人、女性10人の労働者を常時使用している事業場で、労働者が臥床することのできる休養室又は休養所を設けていない。","有害業務を行っていない事業場において、窓その他の開口部の直接外気に向かって開放することができる部分の面積が常時床面積の20分の1以上である屋内作業場に、換気設備を設けていない。","労働者を常時就業させる場所の作業面の照度を、普通の作業について120ルクスとしている。","常時50人の労働者を就業させている屋内作業場の気積が、設備の占める容積及び床面から4mを超える高さにある空間を除き、600m³となっている。"],"answer":4,"exp":"作業面の照度基準（安衛則604条）：精密な作業300ルクス以上、普通の作業150ルクス以上、粗な作業70ルクス以上。","notes":["違反しない。1人当たり1m²以上（安衛則630条）。","違反しない。休養室が必要なのは常時50人以上又は常時女性30人以上（安衛則618条）。45人・女性10人なので不要。","違反しない。床面積の1/20以上の開口部があれば換気設備は不要（安衛則601条）。","違反する（正答）。普通の作業は150ルクス以上。","違反しない。1人当たり10m³以上必要で、50人×10＝500m³以上（安衛則600条）。"],"ref":"安衛則600条・601条・604条・618条・630条"},{"id":"B26","set":"B","no":26,"cat":"law_g","topic":"労働時間・休憩（労働基準法）","freq":2,"q":"労働基準法における労働時間等に関する次の記述のうち、法令上、誤っているものはどれか。","choices":["機密の事務を取り扱う者については、所轄労働基準監督署長の許可を受けなくても、労働時間、休憩及び休日に関する規定は適用されない。","監督又は管理の地位にある者については、労働時間、休憩及び休日に関する規定は適用されないが、深夜業に関する規定は適用される。","労働時間に関する規定の適用については、事業場を異にする場合は労働時間を通算しない。","使用者は、労働時間が6時間を超える場合においては少なくとも45分、8時間を超える場合においては少なくとも1時間の休憩時間を労働時間の途中に与えなければならない。","休憩時間は、原則として、一斉に与え、労働者に自由に利用させなければならない。"],"answer":3,"exp":"労働時間は、事業場を異にする場合においても労働時間に関する規定の適用については通算する（労基法38条1項）。なお、監視又は断続的労働に従事する者の適用除外には所轄労働基準監督署長の許可が必要。","notes":["正しい。労基法41条2号。","正しい。労基法41条。","誤り（正答）。通算する。","正しい。労基法34条。","正しい。労基法34条2項・3項。"],"ref":"労基法34条・38条・41条"},{"id":"B27","set":"B","no":27,"cat":"law_g","topic":"時間外労働の上限規制","freq":3,"q":"労働基準法に基づく時間外・休日労働に関する協定（労使協定）に関する次の文中の［　］内に入れるAからDの数値の組合せとして、正しいものは(1)～(5)のうちどれか。\nただし、労働時間に関する適用猶予及び適用除外はないものとし、変形労働時間制は適用されていないものとする。\n「時間外労働の限度時間は、1か月について［A］時間、1年について［B］時間である。臨時的な特別の事情があって労使が合意する場合（特別条項）でも、時間外労働と休日労働の合計は、2か月ないし6か月の平均でいずれも［C］時間以内とし、また、時間外労働が1か月［A］時間を超えることができるのは、1年について［D］か月以内に限られる。」","choices":["A:45　B:360　C:80　D:6","A:45　B:360　C:100　D:6","A:45　B:540　C:80　D:8","A:60　B:360　C:100　D:6","A:60　B:720　C:80　D:8"],"answer":1,"exp":"原則の上限は月45時間・年360時間。特別条項の場合も、①時間外労働は年720時間以内、②時間外＋休日労働は月100時間未満、③時間外＋休日労働の2～6か月平均は80時間以内、④月45時間超は年6か月まで。","notes":["正しい（正答）。","誤り。100時間は「単月」で未満とする数値。","誤り。","誤り。","誤り。"],"ref":"労基法36条"},{"id":"B28","set":"B","no":28,"cat":"hyg_g","topic":"照明・採光","freq":3,"q":"照明、採光などに関する次の記述のうち、誤っているものはどれか。","choices":["あらゆる方向から同程度の明るさの光がさすようにすると、物の立体感がはっきりして見やすくなる。","部屋の彩色に当たっては、目の高さ以下は濁色にし、目より上方の壁や天井は明るい色を用いるとよい。","照度の単位はルクスで、1ルクスは光度1カンデラの光源から1m離れた所で、その光に直角な面が受ける明るさに相当する。","照明設備については、6か月以内ごとに1回、定期に点検する。","全般照明と局部照明を併用する場合、全般照明による照度は、局部照明による照度の10分の1以上になるようにする。"],"answer":1,"exp":"あらゆる方向から同程度の明るさの光が当たると、影ができず物の立体感がなくなってしまうことがある。","notes":["誤り（正答）。立体感がなくなる。","正しい。","正しい。","正しい。安衛則605条、事務所則10条。","正しい。"],"ref":"労働衛生（一般）テキスト"},{"id":"B29","set":"B","no":29,"cat":"hyg_g","topic":"健康保持増進指針","freq":3,"q":"厚生労働省の「事業場における労働者の健康保持増進のための指針」に基づく健康保持増進対策に関する次の記述のうち、適切でないものはどれか。","choices":["健康保持増進対策の推進に当たっては、労使、産業医、衛生管理者等で構成される衛生委員会等を活用する。","事業者は、健康保持増進方針を表明し、健康保持増進対策を推進する。","健康測定の結果に基づき行う健康指導には、運動指導、メンタルヘルスケア、栄養指導、口腔保健指導、保健指導が含まれる。","健康保持増進措置には、個々の労働者を対象とするものと、労働者を集団として捉えて実施するものとがある。","健康保持増進措置は、生活習慣上の課題を有する労働者に限って実施するものであり、課題のない労働者を対象とする必要はない。"],"answer":5,"exp":"指針では、生活習慣上の課題を有する労働者への個別の取組に加え、生活習慣上の課題の有無にかかわらず労働者を集団として捉えて実施する取組（ポピュレーションアプローチ）も行うこととしている。","notes":["適切。","適切。","適切。","適切。","不適切（正答）。"],"ref":"事業場における労働者の健康保持増進のための指針"},{"id":"B30","set":"B","no":30,"cat":"hyg_g","topic":"脳血管疾患・虚血性心疾患","freq":3,"q":"脳血管疾患及び虚血性心疾患に関する次の記述のうち、誤っているものはどれか。","choices":["虚血性の脳血管疾患である脳梗塞は、脳血管自体の動脈硬化性病変による脳血栓症と、心臓や動脈壁の血栓が剥がれて脳血管を閉塞する脳塞栓症に分類される。","心筋梗塞では、ニトログリセリンの舌下投与により、通常、数分以内に胸痛がおさまる。","心筋梗塞は、心筋の一部分に不可逆的な壊死が起こるもので、突然激しい胸痛が起こり、30分以上続くこともある。","くも膜下出血は、脳動脈瘤の破裂によるものが多く、突然の激しい頭痛で発症することが多い。","狭心症は、心筋の一部分に可逆的な虚血が起こるもので、その発作は通常数分程度、長くても15分以内におさまることが多い。"],"answer":2,"exp":"ニトログリセリンの舌下投与が効きやすいのは狭心症の発作。心筋梗塞の胸痛は持続し、ニトログリセリンでは治まりにくいため、速やかな救急搬送が必要。","notes":["正しい。","誤り（正答）。","正しい。","正しい。","正しい。"],"ref":"労働衛生（一般）テキスト"},{"id":"B31","set":"B","no":31,"cat":"hyg_g","topic":"腰痛予防対策指針","freq":3,"q":"厚生労働省の「職場における腰痛予防対策指針」に基づく、重量物取扱い作業における腰痛予防対策に関する次の記述のうち、誤っているものはどれか。","choices":["満18歳以上の女性労働者が人力のみにより取り扱う物の重量は、男性が取り扱うことのできる重量の60％位までとする。","重量物取扱い作業に常時従事する労働者に対しては、当該作業に配置する際及びその後6か月以内ごとに1回、定期に、医師による腰痛の健康診断を行う。","腰部保護ベルトは、全員に一律に使用させるのではなく、個人ごとに効果を確認してから使用の適否を判断する。","床面などから荷物を持ち上げる場合には、両膝を伸ばしたまま上体を下方に曲げて荷物をかかえ、上体を起こすようにする。","満18歳以上の男性労働者が人力のみにより取り扱う物の重量は、体重のおおむね40％以下となるように努める。"],"answer":4,"exp":"荷物を持ち上げるときは、できるだけ身体を対象物に近づけ、片足を少し前に出し、膝を曲げて腰を十分に降ろして荷物をかかえ、膝を伸ばすことによって立ち上がる。膝を伸ばしたままの前屈姿勢は腰への負担が大きい。","notes":["正しい。","正しい。","正しい。","誤り（正答）。","正しい。"],"ref":"職場における腰痛予防対策指針"},{"id":"B32","set":"B","no":32,"cat":"hyg_g","topic":"出血・熱傷の応急手当","freq":3,"q":"出血及び熱傷の応急手当に関する次の記述のうち、誤っているものはどれか。","choices":["熱傷でできた水疱は、破らないようにする。","止血法には直接圧迫法と間接圧迫法などがあるが、一般人が行う止血法としては直接圧迫法が推奨されている。","衣服の上から熱湯をかぶった場合は、すぐに衣服を脱がせてから冷却する。","化学薬品がかかった場合は、直ちに中和剤により中和するよりも、まず大量の水で洗い流すことが基本である。","体内の全血液量は体重の約13分の1で、その約3分の1を短時間に失うと生命が危険な状態となる。"],"answer":3,"exp":"衣服の上から熱湯をかぶった場合は、無理に脱がせると皮膚がはがれるおそれがあるため、衣服の上から水をかけて冷やす。","notes":["正しい。","正しい。","誤り（正答）。衣服の上から冷やす。","正しい。","正しい。"],"ref":"労働衛生（一般）テキスト、救急蘇生法の指針"},{"id":"B33","set":"B","no":33,"cat":"hyg_g","topic":"感染症","freq":2,"q":"感染症に関する次の記述のうち、誤っているものはどれか。","choices":["インフルエンザウイルスにはA型、B型及びC型の三つの型があるが、流行の原因となるのは主としてA型及びB型である。","微生物を含む飛沫の水分が蒸発して、5μm以下の小粒子として長時間空気中に浮遊し、空調などを通じて感染することを空気感染という。","人間の抵抗力が低下した場合に、通常は多くの人には影響を及ぼさない病原体が病気を発症させることを日和見感染という。","感染が成立しているが症状が現れないまま病原体を保有している者（キャリア）は、他の人に感染させるおそれはない。","感染が成立しているが、症状が現れない状態を不顕性感染という。"],"answer":4,"exp":"キャリアは症状がなくても病原体を保有しており、感染源となって他の人に感染させるおそれがある。","notes":["正しい。","正しい。","正しい。","誤り（正答）。","正しい。"],"ref":"労働衛生（一般）テキスト"},{"id":"B34","set":"B","no":34,"cat":"hyg_g","topic":"メタボリックシンドローム","freq":2,"q":"日本人のメタボリックシンドローム診断基準で、腹部肥満（内臓脂肪の蓄積）とされるウエスト周囲径（腹囲）の基準として、正しいものは次のうちどれか。","choices":["男性85cm以上、女性90cm以上","男性90cm以上、女性85cm以上","男性85cm以上、女性80cm以上","男性90cm以上、女性90cm以上","男性80cm以上、女性85cm以上"],"answer":1,"exp":"腹囲（男性85cm以上、女性90cm以上：内臓脂肪面積100cm²以上に相当）に加え、①血清脂質異常（中性脂肪150mg/dL以上かつ／又はHDLコレステロール40mg/dL未満）、②血圧高値（収縮期130mmHg以上かつ／又は拡張期85mmHg以上）、③高血糖（空腹時血糖110mg/dL以上）のうち2つ以上で診断される。","notes":["正しい（正答）。","誤り。男女が逆。","誤り。","誤り。","誤り。"],"ref":"メタボリックシンドローム診断基準検討委員会（2005）"},{"id":"B35","set":"B","no":35,"cat":"phys","topic":"免疫","freq":3,"q":"免疫に関する次の記述のうち、誤っているものはどれか。","choices":["抗原とは、免疫に関係する細胞によって異物として認識される物質のことである。","抗原に対する免疫反応が過剰に起こり、逆に人体の組織や細胞に傷害を与えてしまうことをアレルギーという。","体液性免疫は、リンパ球が直接に病原体などを取り込んで排除するものであり、細胞性免疫は、リンパ球が産生する抗体によって病原体を攻撃するものである。","リンパ球には、抗体を産生するBリンパ球と、細胞性免疫の作用を持つTリンパ球などがある。","抗体とは、体内に入ってきた抗原に対して体液性免疫において作られる免疫グロブリンと呼ばれる蛋白質のことで、抗原に特異的に結合し、抗原の働きを抑える。"],"answer":3,"exp":"体液性免疫：Bリンパ球が産生する抗体（免疫グロブリン）によって病原体を攻撃。細胞性免疫：Tリンパ球などが直接に病原体や感染細胞を攻撃・排除。","notes":["正しい。","正しい。","誤り（正答）。説明が逆。","正しい。","正しい。"],"ref":"労働生理テキスト"},{"id":"B36","set":"B","no":36,"cat":"phys","topic":"肝臓の機能","freq":3,"q":"肝臓の機能として、誤っているものは次のうちどれか。","choices":["ヘモグロビンを合成する。","胆汁を生成する。","コレステロールとリン脂質を合成する。","血液凝固物質であるフィブリノーゲンを合成する。","アミノ酸の分解で生じたアンモニアから尿素を合成する。"],"answer":1,"exp":"ヘモグロビン（赤血球）は骨髄で作られる。肝臓の機能：グリコーゲンの合成・分解、蛋白質（アルブミン、フィブリノーゲン等）の合成、尿素の合成、胆汁の生成、有害物質の分解（解毒）、コレステロールの合成など。","notes":["誤り（正答）。","正しい。","正しい。","正しい。","正しい。"],"ref":"労働生理テキスト"},{"id":"B37","set":"B","no":37,"cat":"phys","topic":"感覚器（聴覚・平衡・皮膚・嗅覚）","freq":3,"q":"感覚又は感覚器に関する次の記述のうち、誤っているものはどれか。","choices":["中耳にある鼓室は、耳管によって咽頭に通じており、その内圧は外気圧と等しく保たれている。","内耳にある前庭は体の傾きの方向や大きさを、半規管は体の回転の方向や速度を感じる。","皮膚感覚の感覚点のうち、痛覚点の密度は、他の感覚点に比べて高い。","嗅覚は、わずかな匂いでも感じるほど鋭敏で、同一の臭気に対しても疲労しにくい。","耳は、聴覚と平衡感覚をつかさどる器官で、外耳、中耳及び内耳の三つの部位に分かれる。"],"answer":4,"exp":"嗅覚は非常に鋭敏だが、同一臭気に対して疲労しやすく、しばらくすると匂いを感じなくなる。","notes":["正しい。","正しい。前庭・半規管は中耳ではなく内耳にある。","正しい。冷覚点の密度は低い。","誤り（正答）。疲労しやすい。","正しい。"],"ref":"労働生理テキスト"},{"id":"B38","set":"B","no":38,"cat":"phys","topic":"体温調節","freq":3,"q":"体温調節に関する次の記述のうち、正しいものはどれか。","choices":["人体からの放熱は、主に呼気によって行われる。","寒冷な環境においては、皮膚の血管が拡張して血流量が増え、熱の放散が増加する。","暑熱な環境においては、内臓の血流量が増加し体内の代謝活動が亢進することにより、人体からの熱の放散が促進される。","体温調節中枢は、小脳にある。","不感蒸泄とは、発汗とは別に、皮膚及び呼吸器から常に少しずつ水分が蒸発している現象をいう。"],"answer":5,"exp":"放熱は、ふく射（放射）、伝導・対流、蒸発（発汗・不感蒸泄）などによって行われ、ふく射によるものが大きい。体温調節中枢は間脳の視床下部にある。","notes":["誤り。","誤り。寒冷時は皮膚の血管が収縮し血流量が減り放熱が減少する。","誤り。暑熱時は内臓の血流量が減少し、代謝活動が抑制される。","誤り。間脳の視床下部。","正しい（正答）。"],"ref":"労働生理テキスト"},{"id":"B39","set":"B","no":39,"cat":"phys","topic":"代謝","freq":3,"q":"代謝に関する次の記述のうち、正しいものはどれか。","choices":["基礎代謝量は、覚醒、横臥、安静時の測定値で表される。","エネルギー代謝率は、生理的負担だけでなく、精神的作業や情報機器作業のような静的作業にも、作業強度の指標としてそのまま適用できる。","エネルギー代謝率は、一定時間中に体内で消費された酸素と排出された二酸化炭素の容積比である。","基礎代謝量は、同性・同年齢であれば、体表面積にほぼ反比例する。","代謝において、細胞に取り入れられた体脂肪やグリコーゲンなどが分解されてエネルギーを発生する過程を同化という。"],"answer":1,"exp":"エネルギー代謝率（RMR）＝（作業時の消費エネルギー－安静時の消費エネルギー）÷基礎代謝量。動的筋作業の強度を表す指標で、精神的作業や静的作業には適用できない。酸素とCO₂の容積比は呼吸商。","notes":["正しい（正答）。","誤り。","誤り。それは呼吸商。","誤り。ほぼ比例する。","誤り。それは異化。同化は物質を合成する過程。"],"ref":"労働生理テキスト"},{"id":"B40","set":"B","no":40,"cat":"phys","topic":"ストレス","freq":2,"q":"ストレスに関する次の記述のうち、誤っているものはどれか。","choices":["個人にとって適度なストレッサーは、身体的には活性化の源となり、心理的には意欲の向上や作業効率の向上につながることがある。","ストレスに伴う心身の反応には、ノルアドレナリン、アドレナリンなどのカテコールアミンや副腎皮質ホルモンが深く関与している。","ストレス反応には個人差が大きい。","昇進、転勤、配置替えなどがストレスの原因となることがある。","典型的なストレス反応として、副腎皮質ホルモンの分泌の著しい減少がある。"],"answer":5,"exp":"ストレス反応では、副腎皮質ホルモン（コルチゾール等）の分泌が増加する。","notes":["正しい。","正しい。","正しい。","正しい。","誤り（正答）。増加する。"],"ref":"労働生理テキスト"},{"id":"B41","set":"B","no":41,"cat":"phys","topic":"加齢による変化","freq":2,"q":"中高年齢者における加齢による生理機能などの変化に関する次の記述のうち、誤っているものはどれか。","choices":["加齢により、平衡感覚が低下して、転びやすくなる。","老視（老眼）は、主に網膜の視細胞が減少することによって起こる。","加齢による聴力の低下は、一般に高い周波数（高音域）の音から始まる。","加齢により、動体視力が衰える。","加齢により、暗順応の機能が低下する。"],"answer":2,"exp":"老視は、加齢により水晶体の弾力性が低下し、調節力が衰えて近くのものが見えにくくなる状態。","notes":["正しい。","誤り（正答）。主な原因は水晶体の弾力性低下。","正しい。","正しい。","正しい。"],"ref":"労働生理テキスト"},{"id":"B42","set":"B","no":42,"cat":"phys","topic":"心臓・血液循環","freq":3,"q":"心臓及び血液循環に関する次の記述のうち、誤っているものはどれか。","choices":["大動脈及び肺静脈を流れる血液は、酸素に富む動脈血である。","心臓の拍動は、自律神経の支配を受けている。","体循環では、血液は左心室から大動脈に入り、静脈血となって右心室に戻る。","心臓の拍動による動脈圧の変動を末梢の動脈で触知したものを脈拍という。","動脈硬化とは、コレステロールの蓄積などにより、動脈壁が肥厚・硬化して弾力性を失った状態であり、進行すると血管の狭窄や閉塞を招く。"],"answer":3,"exp":"体循環で戻った静脈血は大静脈を経て右心房に入る。肺循環で戻った動脈血は肺静脈を経て左心房に入る。","notes":["正しい。","正しい。","誤り（正答）。右心房に戻る。","正しい。","正しい。"],"ref":"労働生理テキスト"},{"id":"B43","set":"B","no":43,"cat":"phys","topic":"消化器系","freq":3,"q":"消化器系に関する次の記述のうち、誤っているものはどれか。","choices":["唾液は、デンプンを分解するアミラーゼを含む。","胃液は強酸性で、蛋白質を分解するペプシンを含む。","胆汁は肝臓で生成されて胆のうに蓄えられ、十二指腸に分泌される。","膵液は、炭水化物、蛋白質及び脂肪を分解する消化酵素を含む。","水分の大部分は胃で吸収される。"],"answer":5,"exp":"水分や栄養素の吸収は主に小腸で行われ、大腸でも水分が吸収される。胃ではアルコールなど一部を除き、ほとんど吸収されない。","notes":["正しい。","正しい。ペプシノーゲンが胃酸によりペプシンになる。","正しい。","正しい。アミラーゼ、トリプシン、リパーゼ等を含む。","誤り（正答）。"],"ref":"労働生理テキスト"},{"id":"B44","set":"B","no":44,"cat":"phys","topic":"疲労","freq":3,"q":"疲労及びその予防に関する次の記述のうち、誤っているものはどれか。","choices":["疲労の他覚的症状をとらえるための検査として、フリッカー検査がある。","産業疲労は、労働負荷が大きすぎることによって起こるだけでなく、負荷が小さすぎる単調な作業によっても起こることがある。","近年の職場では、全身疲労だけでなく、情報機器作業などによる体の一部の筋肉を使う局所疲労が問題となっている。","日周性疲労とは、休養をとっても回復せず、数日から数か月にわたって蓄積していく疲労をいう。","疲労の自覚的症状をとらえるための方法として、「自覚症しらべ」などによる調査がある。"],"answer":4,"exp":"日周性疲労は、1労働日から翌日にわたる生活サイクルの不調により発現する疲労。休養で回復せず蓄積していくのは慢性疲労。","notes":["正しい。2点弁別閾検査なども用いられる。","正しい。","正しい。","誤り（正答）。記述は慢性疲労の説明。","正しい。"],"ref":"労働生理テキスト"}]}</script>
<script>
(function () {
'use strict';

/* ==========================================================================
   1. 問題データと採点ロジック（DOM に依存しない部分）
   ========================================================================== */
const DATA = JSON.parse(document.getElementById('qdata').textContent);
const META = DATA.meta;
const EX = META.exam;
const CATS = META.categories;
const CAT_KEYS = Object.keys(CATS);
const SETS = META.sets;
const SET_KEYS = Object.keys(SETS);
const QS = DATA.questions;
const QBY = {};
QS.forEach(q => { QBY[q.id] = q; });
const OFFICIAL_URL = META.officialPastExams || 'https://www.exam.or.jp/lckohyo';
const BUILD_ID = '2026-10-13 01:15 data-v2026-10-12';

/* 整数演算で端数誤差を避ける（例: 70点×40% = 28点） */
const ceilPct = (n, pct) => Math.ceil(n * pct / 100);

/* 受験区分（通常／労働生理免除／特例）。出題範囲は "問1～問N" の N から決める */
function buildVariants() {
  return EX.variants.map((v, i) => {
    let maxNo = EX.questions;
    const m = String(v.questions || '').match(/(\d+)\s*[^\d]*$/);
    if (m) maxNo = parseInt(m[1], 10);
    const ref = QS.filter(q => q.set === SET_KEYS[0] && q.no <= maxNo);
    const maxPoints = ref.reduce((s, q) => s + CATS[q.cat].points, 0);
    const passTotal = (v.passTotal != null) ? v.passTotal
      : (i === 0 ? EX.passLine.total : ceilPct(maxPoints, 60));
    return { idx: i, name: v.name, rangeLabel: v.questions, maxNo, minutes: v.timeMinutes, maxPoints, passTotal, count: ref.length };
  });
}
const VARIANTS = buildVariants();

function examQuestions(set, variant) {
  return QS.filter(q => q.set === set && q.no <= variant.maxNo).sort((a, b) => a.no - b.no);
}

/* 範囲別の集計。足切りライン＝範囲満点の40%、合格点＝満点の60%（受験区分ごとに再計算） */
function judge(cats, total, max, passTotal) {
  const failedCats = cats.filter(c => !c.ok);
  const totalOk = total >= passTotal;
  return { cats, total, max, passTotal, totalOk, failedCats, passed: failedCats.length === 0 && totalOk };
}
function gradeExam(qs, answers, variant) {
  const per = {};
  CAT_KEYS.forEach(k => { per[k] = { cat: k, count: 0, correct: 0, got: 0, max: 0, line: 0, ok: true }; });
  qs.forEach(q => {
    const c = per[q.cat], p = CATS[q.cat].points;
    c.count++; c.max += p;
    if (answers[q.id] === q.answer) { c.correct++; c.got += p; }
  });
  const cats = CAT_KEYS.map(k => per[k]).filter(c => c.count > 0);
  cats.forEach(c => { c.line = ceilPct(c.max, 40); c.ok = c.got >= c.line; });
  const total = cats.reduce((s, c) => s + c.got, 0);
  const max = cats.reduce((s, c) => s + c.max, 0);
  const passTotal = variant ? variant.passTotal : ceilPct(max, 60);
  return judge(cats, total, max, passTotal);
}
function gradePractice(qs, answers) {
  const per = {};
  qs.forEach(q => {
    const c = per[q.cat] || (per[q.cat] = { cat: q.cat, count: 0, correct: 0 });
    c.count++;
    if (answers[q.id] === q.answer) c.correct++;
  });
  const cats = CAT_KEYS.filter(k => per[k]).map(k => per[k]);
  const correct = cats.reduce((s, c) => s + c.correct, 0);
  return { cats, correct, total: qs.length };
}
function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = r[i]; r[i] = r[j]; r[j] = t;
  }
  return r;
}

const PFX = 'eisei1:';
const Store = (function () {
  let ok = false;
  const mem = {};
  try {
    const k = PFX + '__probe';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    ok = true;
  } catch (e) { ok = false; }
  return {
    available: ok,
    get(key, fb) {
      try {
        if (Object.prototype.hasOwnProperty.call(mem, key)) return JSON.parse(mem[key]);
        if (!ok) return fb;
        const raw = window.localStorage.getItem(PFX + key);
        return raw == null ? fb : JSON.parse(raw);
      } catch (e) { return fb; }
    },
    set(key, val) {
      let raw;
      try { raw = JSON.stringify(val); } catch (e) { return false; }
      if (ok) {
        try { window.localStorage.setItem(PFX + key, raw); delete mem[key]; return true; } catch (e) { /* 容量超過など */ }
      }
      mem[key] = raw;
      return false;
    },
    remove(key) {
      delete mem[key];
      try { if (ok) window.localStorage.removeItem(PFX + key); } catch (e) { /* ignore */ }
    },
    clearAll() {
      Object.keys(mem).forEach(k => delete mem[k]);
      try {
        if (ok) {
          const del = [];
          for (let i = 0; i < window.localStorage.length; i++) {
            const k = window.localStorage.key(i);
            if (k && k.indexOf(PFX) === 0) del.push(k);
          }
          del.forEach(k => window.localStorage.removeItem(k));
        }
      } catch (e) { /* ignore */ }
    }
  };
})();

const app = document.getElementById('app');
function h(tag, attrs) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (let i = 2; i < arguments.length; i++) {
    const kids = [].concat(arguments[i]).flat(Infinity);
    kids.forEach(c => {
      if (c == null || c === false) return;
      el.append(c.nodeType ? c : document.createTextNode(String(c)));
    });
  }
  return el;
}
const pad2 = n => (n < 10 ? '0' : '') + n;
function fmtClock(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
  return hh + ':' + pad2(mm) + ':' + pad2(ss);
}
function fmtDate(t) {
  const d = new Date(t);
  const base = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  return d.getFullYear() === new Date().getFullYear() ? base : d.getFullYear() + '/' + base;
}

/* 確認ダイアログ（native confirm は使わない） */
let modalOpen = 0;
function dialog(o) {
  if (modalOpen > 0) return Promise.resolve(o.cancelValue);   // ダブルタップ等での二重表示を防ぐ
  return new Promise(resolve => {
    const prev = document.activeElement;
    const close = v => {
      document.removeEventListener('keydown', onKey, true);
      back.remove(); modalOpen--;
      if (prev && prev.focus) { try { prev.focus(); } catch (e) { /* ignore */ } }
      resolve(v);
    };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(o.cancelValue); } };
    const btns = o.actions.map(a => h('button', { class: 'btn ' + (a.kind || ''), onclick: () => close(a.value) }, a.label));
    const modal = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'dlg-t' },
      h('h3', { id: 'dlg-t' }, o.title), o.body ? h('p', null, o.body) : null, h('div', { class: 'acts' }, btns));
    const back = h('div', { class: 'back', onclick: e => { if (e.target === back) close(o.cancelValue); } }, modal);
    document.body.append(back); modalOpen++;
    document.addEventListener('keydown', onKey, true);
    (btns[o.focus != null ? o.focus : 0] || btns[0]).focus();
  });
}
const confirmBox = (title, body, okLabel, kind, cancelLabel) => dialog({
  title, body, cancelValue: false, focus: 1,
  actions: [{ label: okLabel, value: true, kind: kind || 'primary' }, { label: cancelLabel || 'キャンセル', value: false }]
});
let toastTimer = 0;
function toast(msg) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = h('div', { class: 'toast', role: 'status' }, msg);
  document.body.append(t);

}

    active: true, set, variant, qs, limitMs,
    answers: {}, flags: {}, idx: 0,
    startedAt: Date.now(), remainingMs: limitMs, lastSave: 0, warned10: false, finishing: false, timerEl: null, tickId: 0
  };
  if (saved) {
    Object.keys(saved.answers || {}).forEach(id => { if (QBY[id]) E.answers[id] = saved.answers[id]; });
    (saved.flags || []).forEach(id => { if (QBY[id]) E.flags[id] = true; });
    E.idx = Math.min(Math.max(0, saved.idx | 0), qs.length - 1);
    E.startedAt = saved.startedAt || E.startedAt;
    E.remainingMs = Math.min(limitMs, Math.max(0, saved.remainingMs));
